# Policy Tests
#
# Runs policy regression tests against CEL and AI validation engines.
# See docs/specs/policy-test-suite.md for full specification.
#
# Triggers:
#   - Push to main (when policy or test files change)
#   - Manual dispatch with configurable options (CEL and/or AI tests)
#   - Monthly schedule to keep state artifact alive (see note below)
#   NOTE: PR trigger temporarily disabled until AI test state is fully populated on main
#
# AI tests run on PRs with continue-on-error so failures are visible
# but don't block merges. CEL tests are always blocking.
#
# State Persistence:
#   - AI test results are cached in ai-test-state.json
#   - State is persisted as a GitHub Actions artifact (ai-test-state)
#   - Each run restores state from the most recent previous artifact
#   - Content hashes ensure test case changes trigger re-runs
#
# Model matrix is defined in suite.yaml, not hardcoded here.
# AI tests use --wait to pause and resume on rate limits instead of aborting.

name: policy tests

on:
  # TODO: Re-enable pull_request trigger once AI test state is fully populated on main
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - 'internal/config/defaults/**/*.yaml'
  #     - 'internal/config/defaults/tests/**'
  push:
    branches: [main]
    paths:
      - 'internal/config/defaults/**/*.yaml'
      - 'internal/config/defaults/tests/**'
  # Monthly schedule to prevent the ai-test-state artifact from expiring.
  # GitHub Actions artifacts are retained for 90 days from creation. Without periodic
  # runs, a long period of policy inactivity would cause the state to expire, forcing
  # an expensive full re-run of all AI tests. This cron keeps the artifact alive by
  # running incrementally (all tests cached = no API calls) and re-uploading the state.
  schedule:
    - cron: '0 6 1 * *' # First of every month at 6am UTC
  workflow_dispatch:
    inputs:
      suite_dir:
        description: 'Suite directory'
        type: string
        default: 'internal/config/defaults/tests'
      engine:
        description: 'Engine to test'
        type: choice
        options: ['all', 'cel', 'ai']
        default: 'all'
      model:
        description: 'Specific model (e.g., openai:gpt-5-mini) - overrides matrix'
        type: string
        required: false
      tags:
        description: 'Tags to filter (comma-separated)'
        type: string
        required: false
      full:
        description: 'Force re-run all tests (ignore state file cache)'
        type: boolean
        default: false
      retry_failed:
        description: 'Re-run failed/errored tests even if cached'
        type: boolean
        default: false
      include_disabled:
        description: 'Include disabled policies'
        type: boolean
        default: false

env:
  SUITE_DIR: ${{ github.event.inputs.suite_dir || 'internal/config/defaults/tests' }}

# Serialize workflow runs to prevent race conditions on the state artifact
concurrency:
  group: policy-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Suite Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Validate suite
        run: |
          ./maybe-dont test policies \
            --suite-dir ${{ env.SUITE_DIR }} \
            --validate-only

  test-cel:
    name: CEL Policy Tests
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.engine != 'ai'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Run CEL tests
        run: |
          DISABLED_FLAG=""
          if [ "${{ github.event.inputs.include_disabled }}" == "true" ]; then
            DISABLED_FLAG="--include-disabled"
          fi

          TAGS_FLAG=""
          if [ -n "${{ github.event.inputs.tags }}" ]; then
            TAGS_FLAG="--tags ${{ github.event.inputs.tags }}"
          fi

          ./maybe-dont test policies \
            --suite-dir ${{ env.SUITE_DIR }} \
            --engine cel \
            $DISABLED_FLAG \
            $TAGS_FLAG \
            --format json \
            --output cel-results.json

      - name: Upload CEL results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cel-test-results
          path: cel-results.json

  test-ai:
    name: AI Policy Tests
    runs-on: ubuntu-latest
    needs: validate
    continue-on-error: true
    # TODO: Restore pull_request condition when PR trigger is re-enabled
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.engine != 'cel')
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check API keys
        id: check-keys
        run: |
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::No AI provider API keys configured. Set OPENAI_API_KEY and/or ANTHROPIC_API_KEY repository secrets to enable AI policy tests."
            echo "keys_available=false" >> "$GITHUB_OUTPUT"
          else
            echo "keys_available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check-keys.outputs.keys_available == 'true'

      - name: Restore state file from previous run
        if: steps.check-keys.outputs.keys_available == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Download the most recent ai-test-state artifact from a main branch run.
          # Filter to main branch only to prevent feature branch artifacts from polluting state.
          # This provides incremental test execution — only changed tests are re-run.
          artifact_url=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=ai-test-state&per_page=5" \
            --jq '[.artifacts[] | select(.workflow_run.head_branch == "main")][0].archive_download_url // empty')
          if [ -n "$artifact_url" ]; then
            gh api "$artifact_url" > state.zip && unzip -o state.zip && rm state.zip
            echo "Restored state file from previous run"
          else
            echo "No previous state file found, starting fresh"
          fi

      - name: Set up Go
        if: steps.check-keys.outputs.keys_available == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        if: steps.check-keys.outputs.keys_available == 'true'
        run: make build

      - name: Run AI tests
        if: steps.check-keys.outputs.keys_available == 'true'
        run: |
          DISABLED_FLAG=""
          if [ "${{ github.event.inputs.include_disabled }}" == "true" ]; then
            DISABLED_FLAG="--include-disabled"
          fi

          TAGS_FLAG=""
          if [ -n "${{ github.event.inputs.tags }}" ]; then
            TAGS_FLAG="--tags ${{ github.event.inputs.tags }}"
          fi

          # Use specific model if provided, otherwise run full matrix from suite.yaml
          if [ -n "${{ github.event.inputs.model }}" ]; then
            MODEL_FLAG="--model ${{ github.event.inputs.model }}"
          else
            MODEL_FLAG="--matrix"
          fi

          # Default to incremental (skip cached passing tests). Use --full only when explicitly requested.
          RUN_MODE="--incremental"
          if [ "${{ github.event.inputs.full }}" == "true" ]; then
            RUN_MODE="--full"
          fi

          RETRY_FLAG=""
          if [ "${{ github.event.inputs.retry_failed }}" == "true" ]; then
            RETRY_FLAG="--retry-failed"
          fi

          set +e
          ./maybe-dont test policies \
            --suite-dir ${{ env.SUITE_DIR }} \
            --engine ai \
            $MODEL_FLAG \
            $DISABLED_FLAG \
            $TAGS_FLAG \
            $RUN_MODE \
            $RETRY_FLAG \
            --wait \
            --state-file ai-test-state.json \
            --format json \
            --output ai-results.json
          EXIT_CODE=$?
          set -e

          # Exit code 5 means --max-tests limit reached with more tests remaining.
          # Not a failure - just an incomplete run.
          if [ "$EXIT_CODE" -eq 5 ]; then
            echo "::notice::More tests remain (exit code 5). Results so far have been saved to the state file."
          elif [ "$EXIT_CODE" -ne 0 ]; then
            exit $EXIT_CODE
          fi

      - name: Upload AI results
        uses: actions/upload-artifact@v4
        if: always() && steps.check-keys.outputs.keys_available == 'true'
        with:
          name: ai-test-results
          path: ai-results.json

      - name: Upload AI state file
        id: upload-state
        uses: actions/upload-artifact@v4
        if: always() && github.ref == 'refs/heads/main' && steps.check-keys.outputs.keys_available == 'true'
        with:
          name: ai-test-state
          path: ai-test-state.json

      - name: Verify state persisted
        if: always() && steps.upload-state.outcome == 'failure'
        run: |
          echo "::error::Failed to persist ai-test-state artifact. Incremental test results will be lost."
          echo "Check that ai-test-state.json was created by the test step."


  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-cel, test-ai]
    if: always()
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: results

      - name: Generate summary
        run: |
          # --- Results by Engine ---
          echo "## Policy Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          has_results=false
          overall_status="pass"
          cel_blocking_fail=false

          echo "### Results by Engine" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Engine | Tests | Passed | Failed | Errored | Match Rate | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|--------|--------|---------|------------|--------|" >> "$GITHUB_STEP_SUMMARY"

          for dir in results/*/; do
            [ -d "$dir" ] || continue
            for file in "$dir"*.json; do
              [ -f "$file" ] || continue
              has_results=true
              name=$(basename "$file" .json)

              # Read pre-computed aggregate totals from overall_summary (no recalculation)
              tests=$(jq '.overall_summary.total_cases' "$file")
              passed=$(jq '.overall_summary.passed' "$file")
              failed=$(jq '.overall_summary.failed' "$file")
              errored=$(jq '.overall_summary.errored' "$file")
              match_rate=$(jq '.overall_summary.match_rate * 100 | . * 10 | round / 10' "$file")

              if [ "$failed" -gt 0 ] || [ "$errored" -gt 0 ]; then
                status=":x: Failed"
                if [[ "$name" == cel-* ]]; then
                  cel_blocking_fail=true
                fi
              else
                status=":white_check_mark: Passed"
              fi

              echo "| $name | $tests | $passed | $failed | $errored | ${match_rate}% | $status |" >> "$GITHUB_STEP_SUMMARY"
            done
          done

          if [ "$has_results" = false ]; then
            echo "| _(no results)_ | - | - | - | - | - | :grey_question: |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          # --- Model Comparison (only when multiple models exist) ---
          for dir in results/*/; do
            [ -d "$dir" ] || continue
            for file in "$dir"*.json; do
              [ -f "$file" ] || continue
              model_count=$(jq '.results_by_model | length' "$file")
              if [ "$model_count" -gt 1 ]; then
                name=$(basename "$file" .json)
                echo "### Model Comparison ($name)" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "| Model | Passed | Failed | Errored | Match Rate | Avg (ms) | Total (ms) |" >> "$GITHUB_STEP_SUMMARY"
                echo "|-------|--------|--------|---------|------------|----------|------------|" >> "$GITHUB_STEP_SUMMARY"

                jq -r '.results_by_model[] |
                  "\(.model.provider):\(.model.model) | \(.summary.passed) | \(.summary.failed) | \(.summary.errored) | \(.summary.match_rate * 100 | . * 10 | round / 10)% | \(if .summary.total_cases > 0 then (.summary.total_elapsed_ms / .summary.total_cases | round) else 0 end) | \(.summary.total_elapsed_ms)"' "$file" |
                while IFS='|' read -r model passed failed errored match_rate avg_ms total_ms; do
                  echo "| $model |$passed |$failed |$errored |$match_rate |$avg_ms |$total_ms |" >> "$GITHUB_STEP_SUMMARY"
                done

                echo "" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          done

          # --- Slowest Policies (top 5) ---
          # Collect per-policy timings across all result files
          slowest=$(
            for dir in results/*/; do
              [ -d "$dir" ] || continue
              for file in "$dir"*.json; do
                [ -f "$file" ] || continue
                jq -r '
                  .results_by_model[] |
                  .model as $m |
                  .results[] |
                  .actual.policies_executed[]? |
                  "\(.policy_name)\t\($m.provider):\($m.model)\t\(.elapsed_ms)"
                ' "$file" 2>/dev/null
              done
            done | sort -t$'\t' -k3 -nr | head -5
          )

          if [ -n "$slowest" ]; then
            echo "### Slowest Policies (top 5)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Policy | Model | Time (ms) |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|-----------|" >> "$GITHUB_STEP_SUMMARY"
            echo "$slowest" | while IFS=$'\t' read -r policy model ms; do
              echo "| $policy | $model | $ms |" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- Policy Coverage ---
          for dir in results/*/; do
            [ -d "$dir" ] || continue
            for file in "$dir"*.json; do
              [ -f "$file" ] || continue
              has_coverage=$(jq 'has("coverage") and .coverage != null' "$file")
              if [ "$has_coverage" = "true" ]; then
                name=$(basename "$file" .json)
                total=$(jq '.coverage.total_policies' "$file")
                covered=$(jq '.coverage.policies_with_tests' "$file")
                uncovered_count=$(jq '.coverage.policies_without_tests | length' "$file")

                echo "### Policy Coverage ($name)" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "**$covered / $total** policies have test coverage" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"

                if [ "$uncovered_count" -gt 0 ]; then
                  echo "<details><summary>$uncovered_count uncovered policies</summary>" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  jq -r '.coverage.policies_without_tests[] | "- \(.name) (\(.engine))"' "$file" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "</details>" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                fi
              fi
            done
          done

          # --- Thresholds ---
          for dir in results/*/; do
            [ -d "$dir" ] || continue
            for file in "$dir"*.json; do
              [ -f "$file" ] || continue
              has_summary=$(jq 'has("overall_summary") and .overall_summary != null' "$file")
              if [ "$has_summary" = "true" ]; then
                thresholds_met=$(jq '.overall_summary.thresholds_met' "$file")
                min_required=$(jq '.overall_summary.min_match_rate_required * 100 | . * 10 | round / 10' "$file")
                worst=$(jq '.overall_summary.worst_match_rate * 100 | . * 10 | round / 10' "$file")
                name=$(basename "$file" .json)

                if [ "$thresholds_met" = "true" ]; then
                  echo ":white_check_mark: **Thresholds met** ($name): worst match rate ${worst}% >= required ${min_required}%" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo ":x: **Thresholds not met** ($name): worst match rate ${worst}% < required ${min_required}%" >> "$GITHUB_STEP_SUMMARY"
                fi
                echo "" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          done

          # --- Status Banner ---
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$cel_blocking_fail" = true ]; then
            echo ":rotating_light: **CEL tests failed — this is a blocking failure.**" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$has_results" = false ]; then
            echo ":grey_question: **No test results found.** Check that the test jobs completed." >> "$GITHUB_STEP_SUMMARY"
          else
            # Check if AI tests had failures (non-blocking)
            ai_failed=false
            for dir in results/*/; do
              [ -d "$dir" ] || continue
              for file in "$dir"ai-*.json; do
                [ -f "$file" ] || continue
                f=$(jq '.overall_summary.failed' "$file")
                e=$(jq '.overall_summary.errored' "$file")
                if [ "$f" -gt 0 ] || [ "$e" -gt 0 ]; then
                  ai_failed=true
                fi
              done
            done

            if [ "$ai_failed" = true ]; then
              echo ":warning: **AI tests have failures (non-blocking).** Review results for details." >> "$GITHUB_STEP_SUMMARY"
            else
              echo ":tada: **All tests passed!**" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
