name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      flags: ""
    steps:
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "flags=--snapshot" >> $GITHUB_ENV
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v3
        with:
          go-version: '1.25'
          cache: true
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Generate a short-lived token for cross-repo operations.
      # The GitHub App must have contents:write and be installed on
      # maybedont/releases and maybedont/homebrew-tap.
      - name: Generate release token
        id: release-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: maybedont
          repositories: releases,homebrew-tap,maybedont-site
      - name: Resolve release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="release-notes/v${VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Release notes not found: ${NOTES_FILE}"
            echo "Create this file in a PR before tagging. See docs/specs/release-notes-process.md."
            exit 1
          fi
          echo "release_notes_flag=--release-notes=${NOTES_FILE}" >> $GITHUB_ENV
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser-pro
          version: latest
          args: release --clean ${{ env.flags }} ${{ env.release_notes_flag }}
        env:
          # App token for publishing to maybedont/releases and pushing
          # the Homebrew formula to maybedont/homebrew-tap. Docker push
          # uses docker login credentials (set above), not this token.
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          METRICS_API_TOKEN: ${{ secrets.METRICS_API_TOKEN }}
          METRICS_DATASET: ${{ secrets.METRICS_DATASET }}
      - name: Trigger site release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh api repos/maybedont/maybedont-site/dispatches \
            -f event_type=gateway-release \
            -f "client_payload[version]=${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
