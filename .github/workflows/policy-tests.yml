# Policy Test Suite
#
# Runs policy regression tests against CEL and AI validation engines.
# See docs/specs/policy-test-suite.md for full specification.
#
# Triggers:
#   - PR to main when policy files change (CEL tests only by default)
#   - Push to main (runs AI tests and commits updated state file)
#   - Manual dispatch with configurable options (CEL and/or AI tests)
#
# State Persistence:
#   - AI test results are cached in .ai-test-state.json (committed to main)
#   - PRs read state from main but don't commit changes
#   - On merge to main, updated state is committed back
#   - Content hashes ensure test case changes trigger re-runs
#
# Model matrix is defined in suite.yaml, not hardcoded here.
# Tests run serially to avoid rate limiting issues.
#
# ============================================================================
# AI TESTS DISABLED FOR AUTOMATED RUNS
# ============================================================================
# AI policy tests are currently disabled for PR triggers. To re-enable:
#
# 1. Configure repository secrets:
#    - OPENAI_API_KEY
#    - ANTHROPIC_API_KEY
#
# 2. Uncomment the `schedule` trigger below to enable daily runs (recommended
#    to avoid rate limiting - run at most once per day)
#
# 3. Update the `test-ai` job condition to include PR triggers if desired
#    (change from `github.event_name == 'workflow_dispatch'` to also allow
#    `github.event_name == 'pull_request'`)
#
# For now, AI tests can only be run via manual workflow_dispatch.
# ============================================================================

name: Policy Test Suite

on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/config/defaults/**/*.yaml'
      - 'internal/config/defaults/tests/**'
  push:
    branches: [main]
    paths:
      - 'internal/config/defaults/**/*.yaml'
      - 'internal/config/defaults/tests/**'
  # Uncomment to enable scheduled AI tests (once per day to avoid rate limits):
  # schedule:
  #   - cron: '0 6 * * *'  # Daily at 6:00 AM UTC
  workflow_dispatch:
    inputs:
      suite_dir:
        description: 'Suite directory'
        type: string
        default: 'internal/config/defaults/tests'
      engine:
        description: 'Engine to test'
        type: choice
        options: ['all', 'cel', 'ai']
        default: 'all'
      model:
        description: 'Specific model (e.g., openai:gpt-4o-mini) - overrides matrix'
        type: string
        required: false
      tags:
        description: 'Tags to filter (comma-separated)'
        type: string
        required: false
      include_disabled:
        description: 'Include disabled policies'
        type: boolean
        default: false

env:
  SUITE_DIR: ${{ github.event.inputs.suite_dir || 'internal/config/defaults/tests' }}

# Serialize workflow runs to prevent race conditions when committing state file
# If two PRs merge in quick succession, the second will wait for the first to complete
concurrency:
  group: policy-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Suite Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Validate suite
        run: |
          ./maybe-dont test policies \
            --suite-dir ${{ env.SUITE_DIR }} \
            --validate-only

  test-cel:
    name: CEL Policy Tests
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.engine != 'ai'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Run CEL tests
        run: |
          DISABLED_FLAG=""
          if [ "${{ github.event.inputs.include_disabled }}" == "true" ]; then
            DISABLED_FLAG="--include-disabled"
          fi

          TAGS_FLAG=""
          if [ -n "${{ github.event.inputs.tags }}" ]; then
            TAGS_FLAG="--tags ${{ github.event.inputs.tags }}"
          fi

          ./maybe-dont test policies \
            --suite-dir ${{ env.SUITE_DIR }} \
            --engine cel \
            $DISABLED_FLAG \
            $TAGS_FLAG \
            --format junit \
            --output cel-results.xml

      - name: Upload CEL results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cel-test-results
          path: cel-results.xml

  test-ai:
    name: AI Policy Tests
    runs-on: ubuntu-latest
    needs: validate
    # AI tests run on:
    #   - Push to main (to update state file after merge)
    #   - Manual dispatch (when engine is 'all' or 'ai')
    # To enable for PRs, add: || github.event_name == 'pull_request'
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.engine != 'cel')
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      # State file (.ai-test-state.json) is committed to main branch
      # PRs read from main's state but don't commit changes
      # On merge to main, updated state is committed back

      - name: Run AI tests
        run: |
          DISABLED_FLAG=""
          if [ "${{ github.event.inputs.include_disabled }}" == "true" ]; then
            DISABLED_FLAG="--include-disabled"
          fi

          TAGS_FLAG=""
          if [ -n "${{ github.event.inputs.tags }}" ]; then
            TAGS_FLAG="--tags ${{ github.event.inputs.tags }}"
          fi

          # Use specific model if provided, otherwise run full matrix from suite.yaml
          if [ -n "${{ github.event.inputs.model }}" ]; then
            MODEL_FLAG="--model ${{ github.event.inputs.model }}"
          else
            MODEL_FLAG="--matrix"
          fi

          ./maybe-dont test policies \
            --suite-dir ${{ env.SUITE_DIR }} \
            --engine ai \
            $MODEL_FLAG \
            $DISABLED_FLAG \
            $TAGS_FLAG \
            --full \
            --state-file .ai-test-state.json \
            --format junit \
            --output ai-results.xml

          # Note: JSON output would require a second run, doubling API cost.
          # Use local CLI with --format json for detailed analysis when needed.

      - name: Upload AI results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-test-results
          path: ai-results.xml

      # Commit updated state file back to main branch
      # Only runs on push to main (not PRs or manual dispatch from other branches)
      - name: Commit state file
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Check if state file has changes
          if git diff --quiet .ai-test-state.json 2>/dev/null; then
            echo "No changes to state file"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .ai-test-state.json
          git commit -m "chore: update AI test state file [skip ci]"
          git push

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-cel, test-ai]
    if: always()
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: results

      - name: Generate summary
        run: |
          echo "## Policy Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Tests | Passed | Failed | Errored | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-------|--------|--------|---------|--------|" >> $GITHUB_STEP_SUMMARY

          overall_status="pass"

          for dir in results/*/; do
            if [ -d "$dir" ]; then
              for file in "$dir"*.xml; do
                if [ -f "$file" ]; then
                  name=$(basename "$file" .xml)
                  # Parse JUnit XML for summary
                  tests=$(grep -oP 'tests="\K[0-9]+' "$file" 2>/dev/null | head -1 || echo "0")
                  failures=$(grep -oP 'failures="\K[0-9]+' "$file" 2>/dev/null | head -1 || echo "0")
                  errors=$(grep -oP 'errors="\K[0-9]+' "$file" 2>/dev/null | head -1 || echo "0")
                  passed=$((tests - failures - errors))

                  if [ "$failures" -gt 0 ] || [ "$errors" -gt 0 ]; then
                    status=":x: Failed"
                    overall_status="fail"
                  else
                    status=":white_check_mark: Passed"
                  fi

                  echo "| $name | $tests | $passed | $failures | $errors | $status |" >> $GITHUB_STEP_SUMMARY
                fi
              done
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$overall_status" == "fail" ]; then
            echo ":warning: **Some tests failed or errored.** Review the artifacts for details." >> $GITHUB_STEP_SUMMARY
          else
            echo ":tada: **All tests passed!**" >> $GITHUB_STEP_SUMMARY
          fi
