name: vulnerability scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  govulncheck:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          # govulncheck exits non-zero when it finds anything; the filter step
          # below decides whether that fails the build.
          govulncheck -json ./... > vuln-report.json || true

      # Accepted vulnerabilities live in .govulncheck-accepted.yaml so they go
      # through code review and apply the same way to PRs and pushes to main.
      # Entries past review_by stop counting, so stale acceptances get revisited.
      - name: Filter accepted vulnerabilities
        id: filter
        run: |
          set -euo pipefail

          # govulncheck -json outputs pretty-printed multi-line JSON objects
          # (not NDJSON), so slurp them with jq -s.
          jq -s '[.[] | select(.finding) | .finding] | unique_by(.osv)' vuln-report.json > vuln-findings.json

          if [ -f .govulncheck-accepted.yaml ]; then
            yq -o=json '. // []' .govulncheck-accepted.yaml > accepted.json
          else
            echo '[]' > accepted.json
          fi

          # Fail fast on malformed entries rather than silently ignoring them.
          INVALID=$(jq -r '.[] | select((.id // "") == "" or (.reason // "") == "" or ((.review_by // "") | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$") | not)) | (.id // "<missing id>")' accepted.json)
          if [ -n "$INVALID" ]; then
            echo "::error file=.govulncheck-accepted.yaml::Entries need id, reason, and review_by (YYYY-MM-DD): $INVALID"
            exit 1
          fi

          TODAY=$(date -u +%F)
          jq --arg today "$TODAY" '[.[] | select(.review_by >= $today) | .id]' accepted.json > active-ids.json
          jq --arg today "$TODAY" '[.[] | select(.review_by < $today) | .id]' accepted.json > expired-ids.json

          jq --slurpfile active active-ids.json '[.[] | select(.osv as $id | $active[0] | index($id) | not)]' vuln-findings.json > unaccepted.json
          jq --slurpfile active active-ids.json '[.[] | select(.osv as $id | $active[0] | index($id))]' vuln-findings.json > accepted-found.json

          for id in $(jq -r '.[].osv' accepted-found.json); do
            echo "::warning::$id is accepted in .govulncheck-accepted.yaml"
          done
          for id in $(jq -r --slurpfile found vuln-findings.json '.[] | select(. as $id | $found[0] | map(.osv) | index($id) | not)' active-ids.json); do
            echo "::warning file=.govulncheck-accepted.yaml::$id is no longer reported by govulncheck; remove it"
          done

          echo "unaccepted_count=$(jq 'length' unaccepted.json)" >> "$GITHUB_OUTPUT"

      - name: Post vulnerability report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const unaccepted = JSON.parse(fs.readFileSync('unaccepted.json', 'utf8'));
            const acceptedFound = JSON.parse(fs.readFileSync('accepted-found.json', 'utf8'));
            const expired = JSON.parse(fs.readFileSync('expired-ids.json', 'utf8'));
            const header = '## Vulnerability Scan Results';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(header)
            );

            // Only comment when there's something to fix, but update an earlier
            // report so it doesn't keep showing findings that are resolved.
            if (unaccepted.length === 0 && !botComment) {
              return;
            }

            let report = `${header}\n\n`;
            if (unaccepted.length === 0) {
              report += 'No unaccepted vulnerabilities.\n';
            } else {
              report += `Found **${unaccepted.length}** unaccepted vulnerabilities:\n\n`;
              for (const finding of unaccepted) {
                const osv = finding.osv;
                const note = expired.includes(osv) ? ' (acceptance expired)' : '';
                report += `### ${osv}${note}\n`;
                report += `- **Module**: ${finding.trace?.[0]?.module || 'unknown'}\n`;
                report += `- **Details**: https://pkg.go.dev/vuln/${osv}\n\n`;
              }
              report += '---\n\n';
              report += '### How to resolve\n\n';
              report += '1. Upgrade the affected dependency to a fixed version and run `go mod tidy`.\n';
              report += '2. If there is no fix you can take, add an entry to `.govulncheck-accepted.yaml` ';
              report += 'with the reason and a `review_by` date. It goes through review with the rest of the PR.\n';
            }
            if (acceptedFound.length > 0) {
              report += `\nAccepted in \`.govulncheck-accepted.yaml\`: ${acceptedFound.map(f => f.osv).join(', ')}\n`;
            }

            const params = { owner: context.repo.owner, repo: context.repo.repo };
            if (botComment) {
              await github.rest.issues.updateComment({ ...params, comment_id: botComment.id, body: report });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.issue.number, body: report });
            }

      - name: Fail on unaccepted vulnerabilities
        if: steps.filter.outputs.unaccepted_count != '0'
        run: |
          jq -r '.[].osv' unaccepted.json | while read -r id; do
            echo "::error::$id: upgrade to a fixed version or add it to .govulncheck-accepted.yaml (https://pkg.go.dev/vuln/$id)"
          done
          exit 1
