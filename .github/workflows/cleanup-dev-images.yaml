name: cleanup dev container images

on:
  schedule:
    # Run daily at 3am UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      days_to_keep:
        description: 'Delete dev images older than this many days'
        required: false
        default: '7'
        type: string
      dry_run:
        description: 'Dry run (list but do not delete)'
        required: false
        default: true
        type: boolean

env:
  DAYS_TO_KEEP: ${{ inputs.days_to_keep || '7' }}
  DRY_RUN: ${{ inputs.dry_run || 'false' }}

jobs:
  cleanup:
    name: Delete old dev images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old dev-* images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Finding dev-* images older than $DAYS_TO_KEEP days..."

          CUTOFF_DATE=$(date -d "$DAYS_TO_KEEP days ago" -Iseconds)
          echo "Cutoff date: $CUTOFF_DATE"

          # Get all package versions
          VERSIONS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /orgs/maybedont/packages/container/maybedont/versions \
            --paginate)

          # Get all dev-* images sorted by created_at (newest first)
          ALL_DEV_IMAGES=$(echo "$VERSIONS" | jq -s '
            flatten |
            map(select(.metadata.container.tags | any(startswith("dev-")))) |
            sort_by(.created_at) | reverse
          ')

          TOTAL_DEV_COUNT=$(echo "$ALL_DEV_IMAGES" | jq 'length')
          echo "Total dev-* images: $TOTAL_DEV_COUNT"

          if [ "$TOTAL_DEV_COUNT" -le 1 ]; then
            echo "Only $TOTAL_DEV_COUNT dev image(s) exist - keeping at least one"
            exit 0
          fi

          # Get the newest dev image (to always keep)
          NEWEST_ID=$(echo "$ALL_DEV_IMAGES" | jq -r '.[0].id')
          NEWEST_TAGS=$(echo "$ALL_DEV_IMAGES" | jq -r '.[0].metadata.container.tags | join(", ")')
          echo "Newest dev image (will keep): ID $NEWEST_ID, Tags: $NEWEST_TAGS"

          # Filter to dev-* tags older than cutoff, excluding the newest one
          TO_DELETE=$(echo "$ALL_DEV_IMAGES" | jq -r --arg cutoff "$CUTOFF_DATE" --argjson newest_id "$NEWEST_ID" '
            .[] |
            select(.id != $newest_id) |
            select(.created_at < $cutoff) |
            {id: .id, tags: .metadata.container.tags, created: .created_at} |
            @json
          ')

          if [ -z "$TO_DELETE" ]; then
            echo "No dev images found older than $DAYS_TO_KEEP days (excluding newest)"
            exit 0
          fi

          echo ""
          echo "Found images to delete:"
          echo "$TO_DELETE" | jq -r '"  - ID: \(.id), Tags: \(.tags | join(", ")), Created: \(.created)"'

          if [ "$DRY_RUN" = "true" ]; then
            echo ""
            echo "DRY RUN - No images were deleted"
            exit 0
          fi

          echo ""
          echo "Deleting images..."

          echo "$TO_DELETE" | while read -r version; do
            VERSION_ID=$(echo "$version" | jq -r '.id')
            TAGS=$(echo "$version" | jq -r '.tags | join(", ")')

            echo "Deleting version $VERSION_ID (tags: $TAGS)..."

            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              /orgs/maybedont/packages/container/maybedont/versions/$VERSION_ID

            echo "  Deleted"
          done

          echo ""
          echo "Cleanup complete"

      - name: Summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Container Image Cleanup" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Days to keep | $DAYS_TO_KEEP |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry run | $DRY_RUN |" >> $GITHUB_STEP_SUMMARY
