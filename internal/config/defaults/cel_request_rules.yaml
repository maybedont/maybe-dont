# CEL Request Validation Rules
#
# These rules use CEL (Common Expression Language) for deterministic,
# high-performance request validation. CEL rules are evaluated before
# AI rules and are ideal for exact pattern matching.
#
# Available variables:
#   request.method    - MCP method (e.g., "tools/call")
#   request.params    - Request parameters (map)
#
# Useful functions:
#   get(map, key, default) - Safe map access with default value
#   has(request.params.name) - Check if key exists
#   string.contains("substr") - Substring check
#   string.matches("regex") - Regex match

