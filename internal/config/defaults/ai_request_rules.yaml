rules:
    # =============================================================================
    # TOP PRIORITY SECURITY RULES
    # =============================================================================

    - name: "Check mass deletion operations"
      description: "Prevent deletion of multiple files, records, or use of dangerous deletion patterns"
      enabled: true
      action: deny
      prompt: |-
        ANALYZE: Does this operation delete multiple files/records or use dangerous deletion patterns?

        Look for:
        - File deletions: delete_file, rm, remove_file with wildcards (*), recursive flags (-r, --recursive), force flags (-f, --force), or >5 files
        - Database deletions: DELETE FROM without WHERE clause, TRUNCATE TABLE, DROP TABLE, DROP DATABASE
        - Kubernetes deletions: kubectl delete with --all or wildcard selectors

        EXAMPLES:
        - kubectl get po → SAFE: Not a deletion operation
        - kubectl delete po --all → DANGEROUS: Wildcard deletion of all pods
        - kubectl delete po app-1234 → SAFE: Single pod deletion
        - delete_file path="*" → DANGEROUS: Wildcard file deletion
        - delete_file path="./file.txt" → SAFE: Single file deletion
        - DELETE FROM users → DANGEROUS: Mass database deletion with no WHERE clause
        - DELETE FROM users WHERE id = 5 → SAFE: Single record deletion
        - TRUNCATE TABLE logs → DANGEROUS: Table truncation destroys all data

        Tool call: %s

    - name: "Check system directory access"
      description: "Prevent access to critical system directories"
      enabled: true
      action: deny
      prompt: |-
        ANALYZE: Does this operation access dangerous system directories?

        Look for: file paths starting with /etc/, /sys/, /proc/, /boot/, /root/, /var/lib/, /var/run/, /var/spool/, /var/cache/, /usr/bin/, /usr/sbin/, /bin/, /sbin/, C:\Windows\, C:\System32\, C:\Program Files\

        SAFE directories (do NOT block):
        - /var/log/ (reading application logs is normal)

        EXAMPLES:
        - kubectl get po → SAFE: No file path involved
        - read_file path="/etc/passwd" → DANGEROUS: System directory access
        - read_file path="./config.txt" → SAFE: Local file path

        Tool call: %s

    - name: "Check command execution tools"
      description: "Prevent execution of system commands and shell access"
      enabled: true
      action: deny
      prompt: |-
        ANALYZE: Is this tool name on the dangerous command execution list?

        DANGEROUS TOOLS: execute_command, exec, system, shell, bash, cmd, powershell, sh, run_command, subprocess

        EXAMPLES:
        - kubectl get po → SAFE: kubectl is not on the dangerous list
        - bash command="ls" → DANGEROUS: bash is a shell execution tool
        - git status → SAFE: git is not on the dangerous list

        Tool call: %s

    - name: "Check credential file access"
      description: "Prevent access to files that typically contain credentials"
      enabled: true
      action: deny
      prompt: |-
        ANALYZE: Does this operation access credential files?

        Look for: files ending with .env, .key, .pem, .p12, .pfx, .crt, .cer OR paths containing /.ssh/, /.aws/, /.gcp/, /.kube/, /credentials, /secrets, id_rsa, private_key OR files named passwd, shadow, htpasswd, config (in .kube directory)

        EXAMPLES:
        - kubectl get po → SAFE: No file access
        - read_file path=".env" → DANGEROUS: Credential file access
        - read_file path="config.txt" → SAFE: Normal file access

        Tool call: %s

    - name: "Check external network access"
      description: "Prevent HTTP requests to external domains"
      enabled: false
      action: deny
      prompt: |-
        ANALYZE: Does this operation make HTTP/HTTPS requests to external domains?

        Look for: http_request, fetch, download_file with URLs NOT on approved list (localhost, 127.0.0.1, ::1, *.company.com, api.openai.com)

        EXAMPLES:
        - kubectl get po → SAFE: No network request
        - http_request url="https://malicious.com" → DANGEROUS: External domain access
        - fetch url="http://localhost:3000" → SAFE: Approved local domain

        Tool call: %s

    - name: "Check executable file creation"
      description: "Prevent creation of executable files"
      enabled: true
      action: deny
      prompt: |-
        ANALYZE: Does this operation create executable files?

        Look for: write_file, create_file with extensions .exe, .bat, .cmd, .scr, .com, .pif, .sh, .bash, .zsh, .fish, .ps1, .psm1, .psd1 OR .py, .rb, .pl, .js outside approved directories

        APPROVED directories for scripts: ./scripts/, ./dev/, ./test/, /test/, test/fixtures/, tests/

        EXAMPLES:
        - kubectl get po → SAFE: No file creation
        - write_file path="malware.exe" → DANGEROUS: Executable file creation
        - write_file path="./scripts/build.py" → SAFE: Script in approved directory
        - write_file path="./test/fixtures/setup.sh" → SAFE: Test script in approved directory
        - write_file path="report.txt" → SAFE: Non-executable file

        Tool call: %s

    - name: "Check large file operations"
      description: "Prevent operations on excessively large files"
      enabled: true
      action: deny
      prompt: |-
        ANALYZE: Does this operation involve excessively large files or data?

        Look for: file sizes >100MB, content >10MB, processing >1000 files at once

        EXAMPLES:
        - kubectl get po → SAFE: No file sizes mentioned
        - read_file path="huge.csv" size=200MB → DANGEROUS: File exceeds 100MB limit
        - write_file content="[10MB+ data]" → DANGEROUS: Content exceeds size limit
        - read_file path="document.pdf" → SAFE: Normal file size

        Tool call: %s
