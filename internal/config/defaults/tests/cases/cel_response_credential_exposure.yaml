# Test cases for block-credential-exposure CEL response policy
# This policy blocks responses that expose credential patterns
# IMPORTANT: This policy is in audit_only mode by default, so matching results in "allow"
# The policy matches patterns like: password=X, api_key=X, secret=X

# Test: Response containing API key pattern (audit_only = allow with match)
- case_id: cel-resp-010
  title: "Audit response containing api_key pattern"
  tags: [cel, response, credentials, api-key, audit-only]
  notes:
    - "Policy is audit_only so decision is allow even when matched"
    - "Pattern matches: api_key = value or api-key: value"
  phase: response
  engine: cel
  request:
    tool_name: "filesystem__read_file"
    arguments:
      path: "/app/config.json"
  response:
    content:
      - type: text
        text: "api_key = sk-abc123def456ghi789jkl012mno345pqr678stu901vwx"
  expectations:
    decision: allow  # audit_only mode means it logs but doesn't block

# Test: Response containing secret pattern (audit_only = allow with match)
- case_id: cel-resp-011
  title: "Audit response containing secret pattern"
  tags: [cel, response, credentials, secret, audit-only]
  notes:
    - "Policy is audit_only so decision is allow even when matched"
  phase: response
  engine: cel
  request:
    tool_name: "shell__execute"
    arguments:
      command: "cat ~/.aws/credentials"
  response:
    content:
      - type: text
        text: "aws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
  expectations:
    decision: allow  # audit_only mode means it logs but doesn't block

# Test: Response containing password pattern (audit_only = allow with match)
- case_id: cel-resp-012
  title: "Audit response containing password pattern"
  tags: [cel, response, credentials, password, audit-only]
  notes:
    - "Policy is audit_only so decision is allow even when matched"
    - "Pattern matches: password = value"
  phase: response
  engine: cel
  request:
    tool_name: "filesystem__read_file"
    arguments:
      path: "/app/.env"
  response:
    content:
      - type: text
        text: "password = SuperSecret123!"
  expectations:
    decision: allow  # audit_only mode means it logs but doesn't block

# Test: Response without credentials is allowed
- case_id: cel-resp-013
  title: "Allow response without credential patterns"
  tags: [cel, response, allow]
  phase: response
  engine: cel
  request:
    tool_name: "filesystem__read_file"
    arguments:
      path: "/app/README.md"
  response:
    content:
      - type: text
        text: "# Application\n\nThis is a sample application.\n\n## Installation\n\n```\nnpm install\n```"
  expectations:
    decision: allow

# Test: Response with placeholder credentials allowed
- case_id: cel-resp-014
  title: "Allow response with placeholder credentials"
  tags: [cel, response, allow]
  phase: response
  engine: cel
  request:
    tool_name: "filesystem__read_file"
    arguments:
      path: "/app/config.example.yaml"
  response:
    content:
      - type: text
        text: "database:\n  host: localhost\n  password: ${DB_PASSWORD}  # Set via environment variable"
  expectations:
    decision: allow
