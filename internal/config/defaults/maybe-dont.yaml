# Maybe Don't AI Configuration
#
# This is the default configuration generated on first run.
# Edit this file to configure your downstream MCP servers and validation rules.
#
# Documentation: https://maybedont.ai/docs

# Application logging configuration
logger:
  level: info  # debug, info, warn, error
  path: stderr # filename, stderr, stdout

# Audit log configuration
audit:
  path: maybedont-audit.log # filename, stderr, stdout
  filter: all # all or deny_only

# Downstream MCP servers configuration
# Configure at least one downstream server to proxy requests to.
# Example configurations:
#
#   # HTTP/SSE server with pass-through authentication
#   github:
#     type: http
#     url: "https://api.githubcopilot.com/mcp/"
#     auth:
#       pass_through:
#         enabled: true
#         headers:
#           - source_header: "X-GitHub-Token"
#             target_header: "Authorization"
#             format: "Bearer {value}"
#
#   # STDIO server (local process)
#   local-mcp:
#     type: stdio
#     command: /path/to/mcp-server
#     args:
#       - --verbose
#
downstream_mcp_servers:
  # Add your downstream MCP servers here
  # example:
  #   type: stdio
  #   command: echo

# Server configuration
server:
  type: stdio  # stdio, http, sse
  # listen_addr: "127.0.0.1:8080"  # Required for http/sse

# Global validation settings
validation:
  # Maximum cumulative time (ms) to block a request waiting for validation decisions
  max_blocking_ms: 90000
  # Maximum time (ms) for any single rule evaluation to complete
  max_rule_evaluation_ms: 45000
  # AI configuration (required when AI validation or audit report is enabled)
  ai:
    endpoint: "https://api.openai.com/v1/chat/completions"
    model: "gpt-4o-mini"
    api_key: "${OPENAI_API_KEY}"  # Set via environment variable

# Request validation configuration
request_validation:
  # CEL-based deterministic request validation
  cel:
    enabled: true
    mode: audit_only  # audit_only = log but don't block; empty = enforce
    rules_file: "cel_request_rules.yaml"
  # AI-powered request validation
  ai:
    enabled: true
    mode: audit_only
    rules_file: "ai_request_rules.yaml"

# Response validation configuration
response_validation:
  # CEL-based deterministic response validation
  cel:
    enabled: false
    mode: audit_only
    rules_file: "cel_response_rules.yaml"
  # AI-powered response validation
  ai:
    enabled: false
    mode: audit_only
    rules_file: "ai_response_rules.yaml"

# Native gateway tools configuration
native_tools:
  audit_log:
    enabled: true
    max_entries: 100
  audit_report:
    enabled: true
    max_entries: 1000
  list_servers:
    enabled: true
  list_sessions:
    enabled: true
