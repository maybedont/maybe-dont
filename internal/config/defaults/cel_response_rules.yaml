# CEL Response Validation Rules
#
# These rules use CEL for deterministic response validation.
# Response validation is disabled by default - enable in maybe-dont.yaml
# if you need to filter or redact tool responses.
#
# Available variables:
#   response.content    - Response content array
#   response.isError    - Whether response is an error
#
# Actions:
#   allow  - Allow the response
#   deny   - Block the response entirely
#   redact - Replace matching content with redaction_replacement

