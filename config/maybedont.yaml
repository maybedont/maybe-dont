# MCP Security Gateway Configuration
# This file configures the MCP security gateway service.
#
# Pass-Through Authentication:
# Extract credentials from incoming request headers and forward to downstream servers.
# Enable per-client via auth.pass_through config with header mappings.

# Logging configuration
logging:
  level: info  # debug, info, warn, error
  path: stderr # filename, stderr, stdout

audit:
  enabled: true
  path: maybedont-audit.log # filename, stderr, stdout

# Downstream MCP servers configuration
downstream_mcp_servers:
  github:
    type: http # stdio, sse, http
    url: "https://api.githubcopilot.com/mcp/"
    auth:
      pass_through:
        enabled: true
        headers:
          - source_header: "X-GitHub-Token"
            target_header: "Authorization"
            format: "Bearer {value}"

  # Example 3: STDIO server (pass-through only works with HTTP/SSE)
  aws-docs:
    type: http
    url: "https://knowledge-mcp.global.api.aws"

# Server configuration
server:
  # Server type (stdio, http, sse)
  type: http
  # Address to listen on (host:port)
  listen_addr: "0.0.0.0:8080"
  # Session idle timeout in minutes.
  # Sessions inactive for longer than this will be cleaned up.
  # When a session expires, the AI agent will need to call maybedont__discover_tools to reconnect.
  # Default: 30 minutes
  # session_timeout_minutes: 30

# Global validation settings
# These settings apply to all validation phases (request, AI request, response, AI response)
validation:
  # Maximum cumulative time (ms) to block a request waiting for validation decisions
  # When exceeded, remaining validations continue asynchronously but the request proceeds (fail-open)
  # Default: 90000ms (90 seconds)
  max_blocking_ms: 10000
  # Maximum time (ms) for any single rule evaluation to complete
  # Default: 45000ms (45 seconds)
  max_rule_evaluation_ms: 10000
  # AI configuration shared by all AI-powered features (request validation, response validation, audit report)
  ai:
    # OpenAI-compatible API endpoint
    endpoint: "https://api.openai.com/v1/chat/completions"
    # Model to use for AI validation
    model: "gpt-4o-mini"
    # API key (required when any AI feature is enabled)
    api_key: "${OPENAI_API_KEY}"

# Request validation configuration
# Contains both CEL (deterministic) and AI-powered request validation
request_validation:
  # CEL-based deterministic request validation using CEL expressions
  cel:
    # Mode: enabled, audit_only, disabled (default: enabled)
    mode: enabled
    # Path to CEL rules file (required when mode is not disabled)
    rules_file: "cel_request_rules.yaml"
  # AI-powered request validation using an LLM
  ai:
    # Mode: enabled, audit_only, disabled (default: audit_only)
    mode: audit_only
    # Path to AI rules file (required when mode is not disabled)
    rules_file: "ai_request_rules.yaml"

# Response validation configuration
# Contains both CEL (deterministic) and AI-powered response validation
response_validation:
  # CEL-based deterministic response validation using CEL expressions
  cel:
    # Mode: enabled, audit_only, disabled (default: disabled)
    mode: disabled
    # Path to CEL response rules file (required when mode is not disabled)
    rules_file: "cel_response_rules.yaml"
  # AI-powered response validation to detect sensitive information
  ai:
    # Mode: enabled, audit_only, disabled (default: disabled)
    mode: disabled
    # Path to AI response rules file (required when mode is not disabled)
    rules_file: "ai_response_rules.yaml"
    # Note: Uses the shared AI configuration from validation.ai above

# Native gateway tools configuration
# These tools are implemented directly in the gateway for introspection
native_tools:
  # Audit log access tool configuration
  audit_log:
    # Enable the maybedont__get_audit_log tool (default: true)
    enabled: true
    # Maximum number of log entries to return (default: 100)
    max_entries: 100

  # Audit report generation tool configuration
  audit_report:
    # Enable the maybedont__generate_audit_report tool (default: true)
    enabled: true
    # Maximum entries to include in report generation (default: 1000)
    max_entries: 1000
    # Note: Uses the shared AI configuration from validation.ai
    # Custom system prompt for report generation (optional - has sensible default)
    # system_prompt: |
    #   You are an AI security analyst reviewing MCP gateway audit logs...

  # List downstream servers tool configuration
  list_servers:
    # Enable the maybedont__list_downstream_servers tool (default: true)
    enabled: true

  # List active sessions tool configuration
  list_sessions:
    # Enable the maybedont__list_sessions tool (default: true)
    enabled: true
