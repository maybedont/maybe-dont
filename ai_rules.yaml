rules:
    # =============================================================================
    # TOP PRIORITY SECURITY RULES
    # =============================================================================
    
    - name: "Block mass deletion operations"
      description: "Prevent deletion of multiple files or use of dangerous deletion flags"
      prompt: |- 
        You are analyzing a file deletion request. Set allow to False if ANY of these conditions are true:
        1. The path contains wildcards: *, ?, [, or {
        2. The operation has recursive flag: -r, -R, --recursive, or recursive=true
        3. The operation has force flag: -f, --force, or force=true
        4. The path is very short (less than 8 characters total)
        5. The operation targets more than 5 files at once
        
        EXAMPLES TO BLOCK:
        - delete_file path="*"
        - rm -rf /any/path
        - delete_files paths=["file1", "file2", "file3", "file4", "file5", "file6"]
        - delete_directory recursive=true
        
        EXAMPLES TO ALLOW:
        - delete_file path="./workspace/specific_file.txt"
        - delete_file path="./temp/report_2024.pdf"
        
        Tool call: %s
        Respond with JSON: { "allowed": true/false, "message": "specific reason" }
      message: "Mass deletion operations are blocked for safety"

    - name: "Block system directory access"
      description: "Prevent access to critical system directories"
      prompt: |-
        You are checking file path access. Set allowed to False if the path starts with ANY of these EXACT prefixes:
        - /etc/
        - /sys/
        - /proc/
        - /boot/
        - /root/
        - /usr/bin/
        - /usr/sbin/
        - /bin/
        - /sbin/
        - C:\Windows\
        - C:\System32\
        - C:\Program Files\
        
        EXAMPLES TO BLOCK:
        - read_file path="/etc/passwd"
        - write_file path="C:\Windows\system32\drivers\etc\hosts"
        - list_directory path="/usr/bin"
        
        EXAMPLES TO ALLOW:
        - read_file path="./workspace/config.txt"
        - read_file path="/home/user/documents/file.txt"
        - write_file path="/tmp/myfile.txt"
        
        Tool call: %s
        Respond with JSON: { "allowed": true/false, "message": "specific reason" }
      message: "Access to system directories is prohibited"

    - name: "Block command execution tools"
      description: "Prevent execution of system commands and shell access"
      prompt: |-
        You are checking for command execution attempts. Block if the tool name is EXACTLY any of these:
        - execute_command
        - exec
        - system
        - shell
        - bash
        - cmd
        - powershell
        - sh
        - run_command
        - subprocess
        
        EXAMPLES TO BLOCK:
        - execute_command command="ls -la"
        - shell command="rm file.txt"
        - bash script="#!/bin/bash\necho hello"
        
        EXAMPLES TO ALLOW:
        - read_file path="script.sh" (reading, not executing)
        - write_file path="command.txt" content="ls -la" (writing text, not executing)
        
        Tool call: %s
        Respond with JSON: { "allowed": true/false, "message": "specific reason" }
      message: "Command execution tools are blocked"

    - name: "Block credential file access"
      description: "Prevent access to files that typically contain credentials"
      prompt: |-
        You are checking file access for credential files. Block if the file path contains ANY of these patterns:
        - Ends with: .env, .key, .pem, .p12, .pfx, .crt, .cer
        - Contains: /.ssh/, /.aws/, /.gcp/, /credentials, /secrets, id_rsa, private_key
        - Exactly matches: passwd, shadow, htpasswd
        
        EXAMPLES TO BLOCK:
        - read_file path=".env"
        - read_file path="./config/database.key"
        - write_file path="/home/user/.ssh/id_rsa"
        - read_file path="./secrets/api_keys.txt"
        
        EXAMPLES TO ALLOW:
        - read_file path="./docs/environment_setup.md"
        - read_file path="./public/ssh_tutorial.txt"
        
        Tool call: %s
        Respond with JSON: { "allowed": true/false, "message": "specific reason" }
      message: "Access to credential files is prohibited"

    - name: "Block path traversal attacks"
      description: "Prevent directory traversal using ../ patterns"
      prompt: |-
        You are checking for path traversal attacks. Block if the file path contains ANY of these:
        - "../" anywhere in the path
        - "..\" anywhere in the path
        - "%2e%2e%2f" (URL encoded ../)
        - "%2e%2e%5c" (URL encoded ..\)
        
        EXAMPLES TO BLOCK:
        - read_file path="../../../etc/passwd"
        - write_file path="uploads/../../../etc/hosts"
        - read_file path="./files/../../../home/user/.ssh/id_rsa"
        
        EXAMPLES TO ALLOW:
        - read_file path="./workspace/file.txt"
        - read_file path="/home/user/documents/report.pdf"
        - write_file path="./temp/output.json"
        
        Tool call: %s
        Respond with JSON: { "allowed": true/false, "message": "specific reason" }
      message: "Path traversal attempt blocked"

    - name: "Block external network access"
      description: "Prevent HTTP requests to external domains"
      prompt: |-
        You are checking network requests. Block if making HTTP/HTTPS requests to domains OTHER than:
        - localhost, 127.0.0.1, ::1
        - *.company.com (replace with your internal domain)
        - api.openai.com
        
        EXAMPLES TO BLOCK:
        - http_request url="https://malicious-site.com/upload"
        - fetch url="http://external-api.example.com/data"
        - download_file url="https://github.com/user/repo/archive/main.zip"
        
        EXAMPLES TO ALLOW:
        - http_request url="https://api.openai.com/v1/chat/completions"
        - fetch url="http://localhost:3000/api/data"
        - http_request url="https://internal.company.com/api/users"
        
        Tool call: %s
        Respond with JSON: { "allowed": true/false, "message": "specific reason" }
      message: "External network access not permitted"

    - name: "Block executable file creation"
      description: "Prevent creation of executable files"
      prompt: |-
        You are checking file creation/writing. Block if creating files with these EXACT extensions:
        - .exe, .bat, .cmd, .scr, .com, .pif
        - .sh, .bash, .zsh, .fish
        - .ps1, .psm1, .psd1
        - .py, .rb, .pl, .js (unless in ./scripts/ or ./dev/ directories)
        
        EXAMPLES TO BLOCK:
        - write_file path="./uploads/malware.exe"
        - create_file path="./temp/script.sh"
        - write_file path="./public/code.py" (outside approved directories)
        
        EXAMPLES TO ALLOW:
        - write_file path="./documents/report.txt"
        - write_file path="./scripts/build.py" (in approved directory)
        - create_file path="./data/config.json"
        
        Tool call: %s
        Respond with JSON: { "allowed": true/false, "message": "specific reason" }
      message: "Creation of executable files is blocked"

    - name: "Block large file operations"
      description: "Prevent operations on excessively large files"
      prompt: |-
        You are checking file size limits. Block if ANY of these conditions are true:
        1. File size mentioned is over 100MB (104,857,600 bytes)
        2. Reading/writing files larger than 50MB (52,428,800 bytes)
        3. Processing more than 1000 files in a single operation
        4. Content length over 10MB (10,485,760 bytes)
        
        EXAMPLES TO BLOCK:
        - read_file path="huge_dataset.csv" (if file is 200MB)
        - write_file content="[very long content over 10MB]"
        - process_files count=5000
        
        EXAMPLES TO ALLOW:
        - read_file path="document.pdf" (normal size)
        - write_file path="report.json" content="[normal JSON under 10MB]"
        - process_files count=50
        
        Tool call: %s
        Respond with JSON: { "allowed": true/false, "message": "specific reason" }
      message: "File size exceeds safety limits"

    - name: "Allow safe operations"
      description: "Default allow for common safe operations"
      prompt: |-
        You are doing a final safety check. ALLOW the operation if it's clearly safe:
        - Reading text files from safe directories
        - Writing to ./workspace/, ./temp/, ./output/ directories
        - Listing directory contents (non-recursive)
        - Processing normal data files (JSON, CSV, TXT, MD)
        
        Set allowed to False only if you identify a specific security risk not caught by other rules.
        
        Tool call: %s
        Respond with JSON: { "allowed": true/false, "message": "specific reason" }
      message: "Operation allowed after safety verification"