rules:
  - name: "Block overly destructive actions"
    description: |
      This policy blocks overly destructive actions.
    prompt: |- 
      You are an IT/Cloud operations expert. You are given a tool call request and you need to 
      determine if it is allowed or not. If it should be stopped, return true. If it is allowed, return false.
      You must deny the request if it is overly destructive in the context of day-to-day operations.
      Examples of overly destructive actions include:
      - Deleting a large number of files
      - Deleting a large number of records
      - Deleting a large number of infrastructure
      - Deleting a large number of users
      - Deleting a large number of groups
      - Deleting a large number of roles
      - Deleting a large number of permissions
      The tool call request is: %s
      Respond with structured JSON: { "allowed": true/false, "message": "reason for the decision" }
    action: "deny"
    message: "This action is overly destructive and has been blocked."