# MCP Security Gateway Configuration
# This file configures the MCP security gateway service.
#
# Pass-Through Authentication:
# Extract credentials from incoming request headers and forward to downstream servers.
# Enable per-client via auth.pass_through config with header mappings.

# Logging configuration
logging:
  level: info  # debug, info, warn, error
  path: stderr # filename, stderr, stdout

audit:
  enabled: true
  path: maybedont-audit.log # filename, stderr, stdout

# Downstream MCP servers configuration
downstream_mcp_servers:
  github:
    type: http # stdio, sse, http
    url: "https://api.githubcopilot.com/mcp/"
    auth:
      pass_through:
        enabled: true
        headers:
          - source_header: "X-GitHub-Token"
            target_header: "Authorization"
            format: "Bearer {value}"

  # Example 3: STDIO server (pass-through only works with HTTP/SSE)
  aws-docs:
    type: http
    url: "https://knowledge-mcp.global.api.aws"

# Server configuration
server:
  # Server type (stdio, http, sse)
  type: http
  # Address to listen on (host:port)
  listen_addr: "0.0.0.0:8080"

# Policy configuration
policy_validation:
  # Enable CEL-based tool validation
  enabled: true
  # Path to CEL policy rules file (required when enabled)
  rules_file: "cel.rules.yaml"

# AI validation configuration
ai_validation:
  # Enable AI-powered tool validation
  enabled: true
  # OpenAI-compatible API endpoint
  endpoint: "https://api.openai.com/v1/chat/completions"
  # API key (required when enabled)
  api_key: "${OPENAI_API_KEY}"
  # Model to use for validation
  model: "gpt-4o-mini"
  # Path to AI policy rules file (required when enabled)
  rules_file: "ai.rules.yaml"

# Response validation configuration
# These policies validate and filter tool call RESPONSES before returning to the client
response_validation:
  # Enable CEL-based response validation
  enabled: false
  # Path to CEL response policy rules file (required when enabled)
  rules_file: "cel_response.rules.yaml"

# AI response validation configuration
# Uses AI to detect and filter sensitive information in responses
ai_response_validation:
  # Enable AI-powered response validation
  enabled: false
  # Path to AI response policy rules file (required when enabled)
  rules_file: "ai_response.rules.yaml"
  # Note: Uses the same endpoint and model as ai_validation above

# Native gateway tools configuration
# These tools are implemented directly in the gateway for introspection
native_tools:
  # Audit log access tool configuration
  audit_log:
    # Enable the maybedont__get_audit_log tool (default: true)
    enabled: true
    # Maximum number of log entries to return (default: 100)
    max_entries: 100

  # Audit report generation tool configuration
  audit_report:
    # Enable the maybedont__generate_audit_report tool (default: true)
    enabled: true
    # AI endpoint to use (defaults to ai_validation endpoint if not specified)
    # endpoint: "https://api.openai.com/v1/chat/completions"
    # Model to use (defaults to ai_validation model if not specified)
    # model: "gpt-4o-mini"
    # API key (defaults to ai_validation api_key if not specified)
    # api_key: ""
    # Maximum entries to include in report generation (default: 1000)
    max_entries: 1000
    # Custom system prompt for report generation (optional - has sensible default)
    # system_prompt: |
    #   You are an AI security analyst reviewing MCP gateway audit logs...

  # List downstream servers tool configuration
  list_servers:
    # Enable the maybedont__list_downstream_servers tool (default: true)
    enabled: true

  # List active sessions tool configuration
  list_sessions:
    # Enable the maybedont__list_sessions tool (default: true)
    enabled: true
