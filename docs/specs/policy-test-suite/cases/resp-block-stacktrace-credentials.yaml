case_id: "resp-block-stacktrace-credentials"
title: "Block stack traces and credential exposure"
action_envelope:
  action_type: "MCP_TOOL_CALL"
  actor: "agent:test"
  target: "runtime__get_error"
  parameters:
    id: "err_123"
  request_id: "req-015"
response_sample:
  raw:
    content:
      - type: "text"
        text: "Traceback (most recent call last):\n  File \"app.py\", line 1\npassword=supersecret"
expectations:
  policies:
    - policy_id: "block-stack-traces"
      decision: "deny"
      reason_tags: ["stack-trace"]
    - policy_id: "block-credential-exposure"
      decision: "deny"
      reason_tags: ["credentials"]
