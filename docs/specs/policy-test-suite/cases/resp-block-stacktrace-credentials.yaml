case_id: "resp-block-stacktrace-credentials"
title: "Block stack traces and credential exposure"
tags: ["security", "credentials", "cel"]
notes:
  - "block-stack-traces is disabled by default; block-credential-exposure is audit_only"
  - "May need include-disabled for evaluation"

phase: "response"
engine: "cel"

request:
  tool_name: "runtime__get_error"
  arguments:
    id: "err_123"

response:
  content:
    - type: "text"
      text: "Traceback (most recent call last):\n  File \"app.py\", line 1\npassword=supersecret"
  is_error: true

expectations:
  decision: "deny"
  policies:
    - policy_name: "block-stack-traces"
      decision: "deny"
    - policy_name: "block-credential-exposure"
      decision: "deny"
