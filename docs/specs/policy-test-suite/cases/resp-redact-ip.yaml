case_id: "resp-redact-ip"
title: "Redact IP addresses in response"
tags: ["pii", "redaction", "cel"]
notes:
  - "Rule is disabled by default; requires --include-disabled for evaluation"
  - "Tests only IP redaction; multiple redaction policies don't chain (last one wins)"

phase: "response"
engine: "cel"

request:
  tool_name: "logs__get_recent"
  arguments:
    limit: 5

response:
  content:
    - type: "text"
      text: "Connection from 192.168.1.10 established."
  is_error: false

expectations:
  decision: "redact"
  redacted_content:
    - type: "text"
      text: "Connection from [IP_REDACTED] established."
  policies:
    - policy_name: "redact-ip-addresses"
      decision: "redact"
