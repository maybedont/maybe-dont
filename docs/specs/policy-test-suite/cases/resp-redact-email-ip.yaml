case_id: "resp-redact-email-ip"
title: "Redact email and IP addresses in response"
tags: ["pii", "redaction", "ai"]
notes:
  - "Both rules are disabled by default; may need include-disabled for evaluation"

phase: "response"
engine: "ai"

request:
  tool_name: "logs__get_recent"
  arguments:
    limit: 5

response:
  content:
    - type: "text"
      text: "Contact admin@example.com from 192.168.1.10 for access."
  is_error: false

expectations:
  decision: "redact"
  redacted_content:
    - type: "text"
      text: "Contact [EMAIL_REDACTED] from [IP_REDACTED] for access."
  policies:
    - policy_name: "redact-email-addresses"
      decision: "redact"
    - policy_name: "redact-ip-addresses"
      decision: "redact"
