case_id: "resp-redact-email-ip"
title: "Redact email and IP addresses in response"
action_envelope:
  action_type: "MCP_TOOL_CALL"
  actor: "agent:test"
  target: "logs__get_recent"
  parameters:
    limit: 5
  request_id: "req-014"
response_sample:
  raw:
    content:
      - type: "text"
        text: "Contact admin@example.com from 192.168.1.10 for access."
expectations:
  policies:
    - policy_id: "redact-email-addresses"
      decision: "redact"
      reason_tags: ["email"]
    - policy_id: "redact-ip-addresses"
      decision: "redact"
      reason_tags: ["ip"]
  overall:
    decision: "redact"
    min_confidence: 0.7
notes:
  - "Both rules are disabled by default; include-disabled is required for evaluation."
