case_id: "resp-redact-internal-paths"
title: "Redact internal file system paths"
tags: ["security", "redaction", "ai"]
notes:
  - "Internal paths should be redacted in responses"

phase: "response"
engine: "ai"

request:
  tool_name: "read_file"
  arguments:
    path: "/Users/alice/projects/app/config.yml"

response:
  content:
    - type: "text"
      text: "Loaded config from /Users/alice/projects/app/config.yml"
  is_error: false

expectations:
  decision: "redact"
  redacted_content:
    - type: "text"
      text: "Loaded config from [PATH_REDACTED]"
  policies:
    - policy_name: "redact-internal-paths"
      decision: "redact"
