case_id: "resp-redact-email"
title: "Redact email addresses in response"
tags: ["pii", "redaction", "cel"]
notes:
  - "Rule is disabled by default; requires --include-disabled for evaluation"

phase: "response"
engine: "cel"

request:
  tool_name: "contacts__get_info"
  arguments:
    id: "user_123"

response:
  content:
    - type: "text"
      text: "Contact admin@example.com for assistance."
  is_error: false

expectations:
  decision: "redact"
  redacted_content:
    - type: "text"
      text: "Contact [EMAIL_REDACTED] for assistance."
  policies:
    - policy_name: "redact-email-addresses"
      decision: "redact"
