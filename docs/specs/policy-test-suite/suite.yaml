version: "v1"
bundle_id: "default-2026-02-03"
description: "Policy regression test suite for Maybe Don't Gateway"

# Provider-level API keys - shared across all models for each provider
# API keys use ${VAR} syntax for environment variable substitution
providers:
  openai:
    api_key: "${OPENAI_API_KEY}"
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"

# Policy sources - files or directories (recursive YAML discovery)
policies:
  cel_request_rules: "internal/config/defaults/cel_request_rules.yaml"
  ai_request_rules: "internal/config/defaults/ai_request_rules.yaml"
  cel_response_rules: "internal/config/defaults/cel_response_rules.yaml"
  ai_response_rules: "internal/config/defaults/ai_response_rules.yaml"

# Acceptance thresholds (default: strict matching)
acceptance:
  min_match_rate: 1.0         # 1.0 = all tests must pass (strict)

# Execution configuration
execution:
  timeout_ms: 30000           # Timeout per test case (default: 30s)
  retries: 2                  # Retry on transient errors (5xx, timeouts only)
  retry_delay_ms: 1000        # Delay before retry

# Engine configuration
engines:
  cel:
    enabled: true
  ai:
    enabled: true
    # =========================================================================
    # AVAILABLE AI MODELS (as of February 2026)
    # =========================================================================
    #
    # ANTHROPIC CLAUDE MODELS
    # -----------------------
    # Current Generation (recommended):
    #   - claude-opus-4-6              Latest flagship, best for complex tasks
    #   - claude-sonnet-4-5-20250929   Best speed/intelligence balance (alias: claude-sonnet-4-5)
    #   - claude-haiku-4-5-20251001    Fastest, near-frontier intelligence (alias: claude-haiku-4-5)
    #
    # Legacy (still available, migration recommended):
    #   - claude-opus-4-5-20251101     Previous Opus 4.5 (alias: claude-opus-4-5)
    #   - claude-opus-4-1-20250805     Opus 4.1 (alias: claude-opus-4-1)
    #   - claude-sonnet-4-20250514     Sonnet 4.0 (alias: claude-sonnet-4-0)
    #   - claude-opus-4-20250514       Opus 4.0 (alias: claude-opus-4-0)
    #   - claude-3-7-sonnet-20250219   Claude 3.7 Sonnet (alias: claude-3-7-sonnet-latest)
    #   - claude-3-haiku-20240307      Claude 3 Haiku (cheapest, no extended thinking)
    #
    # Retired (no longer available):
    #   - claude-3-sonnet-20240229     Retired July 21, 2025
    #   - claude-3-5-haiku-20241022    Use claude-haiku-4-5-20251001 instead
    #   - claude-2.1                   Retired July 21, 2025
    #
    # OPENAI GPT MODELS
    # -----------------
    # Current Generation (GPT-4.1 series):
    #   - gpt-4.1                      Smartest non-reasoning model, 1M context
    #   - gpt-4.1-mini                 Balanced speed/intelligence
    #   - gpt-4.1-nano                 Cost-optimized, fastest
    #
    # Previous Generation (GPT-4o series, still available in API):
    #   - gpt-4o                       High-intelligence flagship
    #   - gpt-4o-mini                  Cost-effective option
    #   - chatgpt-4o-latest            Latest 4o with updates
    #
    # Note: GPT-4o series being retired from ChatGPT Feb 13, 2026 but
    # remains available in the API.
    #
    # =========================================================================
    #
    # Model matrix includes a wide range of models to:
    # 1. Discover cost optimization opportunities (nano/haiku may be sufficient)
    # 2. Establish accuracy ceilings (high-tier models)
    # 3. Validate policy robustness across model capabilities
    # 4. Compare generations (4o vs 4.1) and providers (OpenAI vs Anthropic)
    #
    # API keys are inherited from the 'providers' section above.
    # Use 'enabled: false' to disable a model without removing it from the matrix.
    model_matrix:
      # OpenAI 4o series (previous generation)
      - provider: "openai"
        model: "gpt-4o"  # High-intelligence flagship
        parameters:
          temperature: 0.0

      - provider: "openai"
        model: "gpt-4o-mini"  # Cost-effective option
        parameters:
          temperature: 0.0

      # OpenAI 4.1 series (current generation)
      - provider: "openai"
        model: "chatgpt-4o-latest"  # Latest 4o with updates
        parameters:
          temperature: 0.0

      - provider: "openai"
        model: "gpt-4.1-mini"  # Balanced speed/intelligence
        parameters:
          temperature: 0.0

      - provider: "openai"
        model: "gpt-4.1-nano"  # Cost-optimized, fastest
        parameters:
          temperature: 0.0

      # Anthropic models - high to low capability
      # Using dated versions for reproducible test results
      - provider: "anthropic"
        model: "claude-opus-4-6"  # Latest flagship, highest quality
        parameters:
          max_tokens: 256  # Policy validation responses are small JSON
          temperature: 0.0

      - provider: "anthropic"
        model: "claude-opus-4-5-20251101"  # High quality
        parameters:
          max_tokens: 256  # Policy validation responses are small JSON
          temperature: 0.0

      - provider: "anthropic"
        model: "claude-sonnet-4-5-20250929"  # Balanced performance and quality
        parameters:
          max_tokens: 256  # Policy validation responses are small JSON
          temperature: 0.0

      - provider: "anthropic"
        model: "claude-haiku-4-5-20251001"  # Fast and cost-effective
        parameters:
          max_tokens: 256  # Policy validation responses are small JSON
          temperature: 0.0

      # Google Gemini (via OpenAI-compatible endpoint)
      # Requires GEMINI_API_KEY - enable after setting up API key
      - provider: "openai_compatible"
        model: "gemini-2.5-flash"
        endpoint: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
        api_key: "${GEMINI_API_KEY}"
        enabled: false
        parameters:
          temperature: 0.0

      - provider: "openai_compatible"
        model: "gemini-2.5-pro"
        endpoint: "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
        api_key: "${GEMINI_API_KEY}"
        enabled: false
        parameters:
          temperature: 0.0

      # Groq (via OpenAI-compatible endpoint)
      # Requires GROQ_API_KEY - enable after setting up API key
      - provider: "openai_compatible"
        model: "llama-3.3-70b-versatile"
        endpoint: "https://api.groq.com/openai/v1/chat/completions"
        api_key: "${GROQ_API_KEY}"
        enabled: false
        parameters:
          temperature: 0.0

      # Perplexity (via OpenAI-compatible endpoint)
      # Requires PERPLEXITY_API_KEY - enable after setting up API key
      - provider: "openai_compatible"
        model: "sonar-pro"
        endpoint: "https://api.perplexity.ai/chat/completions"
        api_key: "${PERPLEXITY_API_KEY}"
        enabled: false
        parameters:
          temperature: 0.0

      # Example: Azure OpenAI (commented out - uncomment to test Azure endpoint)
      # - provider: "openai_compatible"
      #   endpoint: "https://myorg.openai.azure.com/openai/deployments/gpt-4o-mini/chat/completions"
      #   model: "gpt-4o-mini"
      #   api_key: "${AZURE_OPENAI_API_KEY}"
      #   query_params:
      #     api-version: "2024-02-15-preview"
      #   parameters:
      #     temperature: 0.0

      # Example: Local Ollama (commented out - uncomment for local dev testing)
      # - provider: "openai_compatible"
      #   endpoint: "http://localhost:11434/v1/chat/completions"
      #   model: "llama3"
      #   api_key: ""  # Override to empty for local
      #   parameters:
      #     temperature: 0.0

# Optional: Default filters (can be overridden by CLI flags)
filters:
  tags: []                    # Only run cases with these tags (empty = all)
  exclude_tags: []            # Skip cases with these tags
  case_pattern: "*"           # Glob pattern for case IDs
