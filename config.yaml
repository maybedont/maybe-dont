# MCP Security Proxy Configuration

# Server configuration
server:
  # Server type (stdio, http, sse)
  type: http
  # Address to listen on (host:port)
  listen_addr: "127.0.0.1:8080"
  # Log level (debug, info, warn, error)
  log_level: "info"
  # Log format (json or text)
  log_format: "json"

# Policy configuration
policy_validation:
  # Enable CEL-based tool validation
  enabled: true
  # Path to CEL policy rules file (optional, uses embedded rules by default)
  # rules_file: "cel_rules.yaml"

# AI validation configuration
ai_validation:
  # Enable AI-powered tool validation
  enabled: true
  # OpenAI-compatible API endpoint
  endpoint: "https://api.openai.com/v1/chat/completions"
  # Model to use for validation
  model: "gpt-4o-mini"
  # Path to AI policy rules file (optional, uses embedded rules by default)
  # rules_file: "ai_rules.yaml"

# Client configuration
client:
  type: http
  downstream_url: "https://api.githubcopilot.com/mcp/"
  # Auth header set via MCP_PROXY_CLIENT_HTTP_HEADERS_AUTHORIZATION

  # STDIO example:
  #  # Transport type (stdio, sse, http)
  #  type: stdio
  #  # Command to execute (for stdio)
  #  command: "./kubectl-ai"
  #  # Command arguments
  #  command_args: ["--mcp-server"]

# Audit configuration
audit:
  # Audit log file path
  # Options:
  # - "stdout" - Write to standard output
  # - "stderr" - Write to standard error
  # - "audit.log" - Write to a file in current directory
  # - "/var/log/maybe-dont/audit.log" - Write to a specific path
  # - "/dev/null" - Disable audit logging
  path: "audit.log"
  # Audit log format (json or text)
  # - "json" - Structured JSON format (recommended for production)
  # - "text" - Human-readable text format
  format: "json"
