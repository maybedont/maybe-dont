# MCP Security Gateway Configuration
# This file configures the MCP security gateway service.

# Logging configuration
logging:
  level: info  # debug, info, warn, error
  format: json # json, console
audit:
  enabled: true
  level: info
  format: json
  output: file # stdout, stderr, file
  path: ./audit.log

# Client configuration (downstream MCP server)
client:
  type: http # stdio, sse, http
  # For stdio:
  # command: /path/to/mcp/server
  # command_args: ["--config", "/path/to/config.json"]
  
  # For SSE/HTTP:
  downstream_url: "http://localhost:3000"
  headers:
    Authorization: ""  # Will be set from environment variable
  
  # Auth header set via MCP_GATEWAY_CLIENT_HTTP_HEADERS_AUTHORIZATION

# Server configuration
server:
  # Server type (stdio, http, sse)
  type: http
  # Address to listen on (host:port)
  listen_addr: "0.0.0.0:8080"
  # Log level (debug, info, warn, error)
  log_level: "info"
  # Log format (json or text)
  log_format: "json"

# Policy configuration
policy_validation:
  # Enable CEL-based tool validation
  enabled: true
  # Path to CEL policy rules file (optional, uses embedded rules by default)
  # rules_file: "cel_rules.yaml"

# AI validation configuration
ai_validation:
  # Enable AI-powered tool validation
  enabled: true
  # OpenAI-compatible API endpoint
  endpoint: "https://api.openai.com/v1/chat/completions"
  # Model to use for validation
  model: "gpt-4o-mini"
  # Path to AI policy rules file (optional, uses embedded rules by default)
  # rules_file: "ai_rules.yaml"
