# MCP Security Proxy Configuration

# Server configuration
server:
  # Server type (stdio, http, sse)
  type: "stdio"
  # Address to listen on (host:port)
  listen_addr: "localhost:8080"
  # Log level (debug, info, warn, error)
  log_level: "info"
  # Log format (json or text)
  log_format: "json"
  
  # HTTP server configuration (used when type: "http")
  http:
    # Timeouts in seconds
    read_timeout: 30
    write_timeout: 30
    idle_timeout: 120
    # TLS configuration
    tls:
      enabled: false
      cert_file: "/path/to/cert.pem"
      key_file: "/path/to/key.pem"
    # CORS configuration
    cors:
      enabled: false
      allowed_origins:
        - "https://example.com"
        - "https://api.example.com"
      allowed_methods:
        - "GET"
        - "POST"
        - "OPTIONS"
      allowed_headers:
        - "Content-Type"
        - "Authorization"
        - "X-Requested-With"

  # SSE server configuration (used when type: "sse")
  sse:
    # Timeouts in seconds
    read_timeout: 30
    write_timeout: 30
    idle_timeout: 120
    # SSE-specific settings
    retry_interval: 3000  # milliseconds
    max_connections: 1000
    # TLS configuration
    tls:
      enabled: false
      cert_file: "/path/to/cert.pem"
      key_file: "/path/to/key.pem"

# Authentication configuration
auth:
  # Authentication type (api_key, jwt, mtls)
  type: "api_key"
  # API key for simple authentication
  api_key: "your-api-key-here"
  # JWT configuration
  jwt:
    # JWKS URL for key discovery
    jwks_url: "https://your-auth-server/.well-known/jwks.json"
    # Token issuer
    issuer: "https://your-auth-server"
    # Token audience
    audience: ["mcp-proxy"]
    # JWT claim containing roles
    claim_roles: "roles"
  # mTLS configuration
  mtls:
    # CA certificate file
    ca_file: "/path/to/ca.pem"
    # Client certificate file
    cert_file: "/path/to/cert.pem"
    # Client key file
    key_file: "/path/to/key.pem"

# Policy configuration
policy:
  # Path to CEL policy rules file
  rules_file: "rules.cel"
  # Default policy (allow or deny)
  default: "deny"

# Transport configuration
transport:
  # Transport type (stdio, sse, http)
  type: "stdio"
  # Downstream server URL (for sse/http)
  downstream_url: "http://localhost:8081"
  # Command to execute (for stdio)
  command: "/usr/local/bin/mcp-server"
  # Command arguments
  command_args: ["--config", "/etc/mcp-server/config.yaml"]
  # SSE-specific configuration
  sse:
    # Custom headers
    headers:
      X-Custom-Header: "value"
    # Connection timeout in seconds
    timeout: 30

# Audit configuration
audit:
  # Enable audit logging
  enabled: true
  # Audit log file path
  path: "/var/log/mcp-proxy/audit.log"
  # Audit log format (json or text)
  format: "json" 