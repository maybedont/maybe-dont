# MCP Security Proxy Configuration

# Server configuration
server:
  # Server type (stdio, http, sse)
  type: sse
  # Address to listen on (host:port)
  listen_addr: "127.0.0.1:8080"
  # Log level (debug, info, warn, error)
  log_level: "info"
  # Log format (json or text)
  log_format: "json"

  # SSE server configuration (used when type: "sse")
  sse:
    # TLS configuration
    tls:
      enabled: false
      cert_file: "/path/to/cert.pem"
      key_file: "/path/to/key.pem"

# Authentication configuration
auth:
  # Authentication type (api_key, jwt, mtls)
  type: none

# Policy configuration
policy_validation:
  # Enable CEL-based tool validation
  enabled: true
  # Path to CEL policy rules file
  rules_file: "cel_rules.yaml"

# AI validation configuration
ai_validation:
  # Enable AI-powered tool validation
  enabled: false
  # OpenAI-compatible API endpoint
  endpoint: "https://api.openai.com/v1/chat/completions"
  # Model to use for validation
  model: "gpt-4o-mini"
  # Path to AI policy rules file
  rules_file: "ai_rules.yaml"

# Transport configuration
client:
  # Transport type (stdio, sse, http)
  type: stdio
  # Command to execute (for stdio)
  command: "/home/user/bin/kai"
  # Command arguments
  command_args: ["--mcp-server"]


# Audit configuration
audit:
  # Audit log file path
  path: "stdout"
  # Audit log format (json or text)
  format: "json"