# MCP Security Proxy Configuration

# Server configuration
server:
  # Server type (stdio, http, sse)
  type: sse
  # Address to listen on (host:port)
  listen_addr: "127.0.0.1:8080"
  # Log level (debug, info, warn, error)
  log_level: "debug"
  # Log format (json or text)
  log_format: "json"
  
  # HTTP server configuration (used when type: "http")
  http:
    # Timeouts in seconds
    read_timeout: 30
    write_timeout: 30
    idle_timeout: 120
    # TLS configuration
    tls:
      enabled: false
      cert_file: "/path/to/cert.pem"
      key_file: "/path/to/key.pem"
    # CORS configuration
    cors:
      enabled: true
      allowed_origins:
        - "*"
      allowed_methods:
        - "GET"
        - "POST"
        - "OPTIONS"
      allowed_headers:
        - "Content-Type"
        - "Authorization"
        - "X-Requested-With"

  # SSE server configuration (used when type: "sse")
  sse:
    # Timeouts in seconds
    read_timeout: 30
    write_timeout: 30
    idle_timeout: 120
    # SSE-specific settings
    retry_interval: 3000  # milliseconds
    max_connections: 1000
    # TLS configuration
    tls:
      enabled: false
      cert_file: "/path/to/cert.pem"
      key_file: "/path/to/key.pem"

# Authentication configuration
auth:
  # Authentication type (api_key, jwt, mtls)
  type: none

# Policy configuration
policy:
  # Path to CEL policy rules file
  rules_file: "rules.yaml"
  # Default policy (allow or deny)
  default: "allow"


# Transport configuration
transport:
  # Transport type (stdio, sse, http)
  type: stdio
  # Command to execute (for stdio)
  command: "/home/user/bin/kai"
  # Command arguments
  command_args: ["--mcp-server"]
  # SSE-specific configuration
  # sse:
  #   headers:
  #     Content-Type: "text/event-stream"
  #   timeout: 30

# Audit configuration
audit:
  # Enable audit logging
  enabled: true
  # Audit log file path
  path: "stdout"
  # Audit log format (json or text)
  format: "json" 