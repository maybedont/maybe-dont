# $schema https://goreleaser.com/static/schema-pro.json
version: 2

before:
  hooks:
    # You may remove this if you don't use 'go modules'.
    - go mod tidy
    # you may remove this if you don't need 'go generate'
    - go generate ./...

after:
  hooks:
    # Generate individual .sha256 checksum files for each archive
    - cmd: sh -c 'for f in dist/*.tar.gz dist/*.zip; do [ -f "$f" ] && (cd dist && shasum -a 256 "$(basename "$f")") > "$f.sha256"; done'

release:
  extra_files:
    - glob: dist/*.sha256

upx:
  - enabled: true
    compress: best

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.metricsDataset={{.Env.METRICS_DATASET}}
      - -X main.metricsAPIToken={{.Env.METRICS_API_TOKEN}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    wrap_in_directory: true
    files:
      - README.md
      - src: config/maybedont.yaml
        dst: config/maybedont.yaml
        info:
          mode: 0644
      - src: config/*_rules.yaml
        dst: config/
        info:
          mode: 0644
      - src: config/rules.yaml
        dst: config/rules.yaml
        info:
          mode: 0644
      - LICENSE
dockers:
  # AMD64 image
  - image_templates:
      - "ghcr.io/maybedont/maybe-dont:{{ .Tag }}-amd64"
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}-amd64"
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}.{{ .Minor }}-amd64"
      - "ghcr.io/maybedont/maybe-dont:latest-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=TARGETPLATFORM=linux/amd64"

  # ARM64 image
  - image_templates:
      - "ghcr.io/maybedont/maybe-dont:{{ .Tag }}-arm64"
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}-arm64"
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}.{{ .Minor }}-arm64"
      - "ghcr.io/maybedont/maybe-dont:latest-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=TARGETPLATFORM=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/maybedont/maybe-dont:{{ .Tag }}"
    image_templates:
      - "ghcr.io/maybedont/maybe-dont:{{ .Tag }}-amd64"
      - "ghcr.io/maybedont/maybe-dont:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/maybedont/maybe-dont:v{{ .Major }}"
    image_templates:
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}-amd64"
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}-arm64"
  - name_template: "ghcr.io/maybedont/maybe-dont:v{{ .Major }}.{{ .Minor }}"
    image_templates:
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}.{{ .Minor }}-amd64"
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}.{{ .Minor }}-arm64"
  - name_template: "ghcr.io/maybedont/maybe-dont:latest"
    image_templates:
      - "ghcr.io/maybedont/maybe-dont:latest-amd64"
      - "ghcr.io/maybedont/maybe-dont:latest-arm64"