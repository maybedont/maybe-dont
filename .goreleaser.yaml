version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
    # you may remove this if you don't need go generate
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    wrap_in_directory: true
    files:
      - README.md
      - src: gateway-config.yaml
        info:
          mode: 0644
      - LICENSE
dockers:
  - image_templates:
      - "ghcr.io/maybedont/maybe-dont:{{ .Tag }}"
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}"
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}.{{ .Minor }}"
      - "ghcr.io/maybedont/maybe-dont:latest"

