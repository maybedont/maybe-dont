# $schema https://goreleaser.com/static/schema-pro.json
version: 2
project_name: maybe-dont

# Publish binary releases to the public maybedont/releases repo.
# Docker images are still pushed to ghcr.io/maybedont/maybe-dont via
# docker login (independent of this token).
release:
  github:
    owner: maybedont
    name: releases

before:
  hooks:
    # You may remove this if you don't use 'go modules'.
    - go mod tidy
    # you may remove this if you don't need 'go generate'
    - go generate ./...

after:
  hooks:
    # Reformat checksum files to be sha256sum -c compatible
    - cmd: sh -c 'for f in dist/*.sha256; do [ -f "$f" ] || continue; artifact=$(basename "$f" .sha256); hash=$(cat "$f"); echo "$hash  $artifact" > "$f"; done'
      output: true

checksum:
  name_template: "{{ .ArtifactName }}.sha256"
  split: true

upx:
  # UPX can't pack Mach-O (darwin) or PE/ARM64 (windows_arm64).
  # Two entries needed to compress linux (both arches) and windows (amd64 only).
  - enabled: true
    compress: best
    goos: [linux]
  - enabled: true
    compress: best
    goos: [windows]
    goarch: [amd64]

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.metricsDataset={{.Env.METRICS_DATASET}}
      - -X main.metricsAPIToken={{.Env.METRICS_API_TOKEN}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    wrap_in_directory: true
    # Binary is self-contained with embedded defaults - config files are
    # generated on first run via XDG Base Directory conventions.
    # Use 'maybe-dont gateway defaults export' to extract defaults for customization.
    files:
      - README.md
      - LICENSE
dockers:
  # AMD64 image
  - image_templates:
      - "ghcr.io/maybedont/maybe-dont:{{ .Tag }}-amd64"
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}-amd64"
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}.{{ .Minor }}-amd64"
      - "ghcr.io/maybedont/maybe-dont:latest-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=TARGETPLATFORM=linux/amd64"

  # ARM64 image
  - image_templates:
      - "ghcr.io/maybedont/maybe-dont:{{ .Tag }}-arm64"
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}-arm64"
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}.{{ .Minor }}-arm64"
      - "ghcr.io/maybedont/maybe-dont:latest-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=TARGETPLATFORM=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/maybedont/maybe-dont:{{ .Tag }}"
    image_templates:
      - "ghcr.io/maybedont/maybe-dont:{{ .Tag }}-amd64"
      - "ghcr.io/maybedont/maybe-dont:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/maybedont/maybe-dont:v{{ .Major }}"
    image_templates:
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}-amd64"
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}-arm64"
  - name_template: "ghcr.io/maybedont/maybe-dont:v{{ .Major }}.{{ .Minor }}"
    image_templates:
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}.{{ .Minor }}-amd64"
      - "ghcr.io/maybedont/maybe-dont:v{{ .Major }}.{{ .Minor }}-arm64"
  - name_template: "ghcr.io/maybedont/maybe-dont:latest"
    image_templates:
      - "ghcr.io/maybedont/maybe-dont:latest-amd64"
      - "ghcr.io/maybedont/maybe-dont:latest-arm64"

brews:
  - name: maybe-dont
    repository:
      owner: maybedont
      name: homebrew-tap
      # Uses GITHUB_TOKEN by default (set to GitHub App token in CI).
      # Explicit token only needed if brew tap requires a different token.
    homepage: "https://maybedont.ai"
    description: "Guardrails for agentic AI"
    license: "Proprietary"
    install: |
      bin.install "maybe-dont"
    test: |
      system "#{bin}/maybe-dont", "version"
