# Example CEL Rules with CLI Expression Support
#
# This file demonstrates how to write CEL rules that can validate both
# MCP tool calls and CLI commands. Copy this file to cel_request_rules.yaml
# in your config directory and customize for your needs.
#
# Available context for mcp_expression:
#   - request.method: MCP method (e.g., "tools/call")
#   - request.params.name: Tool name (e.g., "github__create_issue")
#   - request.params.arguments: Tool arguments as a map
#   - tool.name: Shorthand for request.params.name
#   - tool.arguments: Shorthand for request.params.arguments
#
# Available context for cli_expression:
#   - cli.command: The command being executed (e.g., "rm", "gh", "kubectl")
#   - cli.arguments: List of command arguments (e.g., ["-rf", "/tmp"])
#   - cli.working_directory: Current working directory
#   - cli.client_info.hostname: Client hostname
#   - cli.client_info.username: Username running the CLI
#   - cli.client_info.os: Operating system (e.g., "darwin", "linux")
#   - cli.client_info.arch: Architecture (e.g., "amd64", "arm64")
#   - cli.client_info.shell: Shell environment (e.g., "bash", "zsh")
#   - cli.client_info.cli_version: CLI proxy version
#
# CEL Functions Reference:
#   - has(obj, field): Check if a field exists
#   - get(obj, field, default): Get field with default value
#   - list.exists(x, expr): True if any element matches expression
#   - list.all(x, expr): True if all elements match expression
#   - list.size(): Number of elements in list
#   - string.startsWith(prefix): Check string prefix
#   - string.endsWith(suffix): Check string suffix
#   - string.contains(substring): Check for substring
#   - x in [a, b, c]: Check membership in list

rules:
  # ============================================================================
  # DUAL RULES: Both MCP and CLI expressions
  # These rules apply to both MCP tool calls AND CLI commands
  # ============================================================================

  - name: no-destructive-github-actions
    description: "Block destructive GitHub operations from both MCP tools and CLI"
    enabled: true

    # MCP tool expression - evaluated when processing MCP tool calls
    # Uses the prefixed tool name format: {client}__{tool}
    mcp_expression: |
      tool.name == "github__delete_repo" ||
      (tool.name == "github__update_repo" &&
       has(tool.arguments, "delete") && tool.arguments.delete == true)

    # CLI expression - evaluated when processing CLI commands
    cli_expression: |
      cli.command == "gh" &&
      cli.arguments.size() >= 2 &&
      cli.arguments[0] == "repo" &&
      cli.arguments[1] == "delete"

    action: deny
    message: "Destructive GitHub repository operations are not permitted"


  - name: no-force-push
    description: "Block force push operations that could destroy history"
    enabled: true

    mcp_expression: |
      tool.name == "github__push" &&
      has(tool.arguments, "force") && tool.arguments.force == true

    cli_expression: |
      cli.command == "git" &&
      cli.arguments.exists(a, a == "push") &&
      (cli.arguments.exists(a, a == "--force") ||
       cli.arguments.exists(a, a == "-f") ||
       cli.arguments.exists(a, a == "--force-with-lease"))

    action: deny
    message: "Force push operations are not permitted - they can destroy commit history"


  # ============================================================================
  # CLI-ONLY RULES: No MCP equivalent
  # These rules only apply to CLI commands
  # ============================================================================

  - name: no-sudo
    description: "Block sudo commands from AI agents"
    enabled: true

    cli_expression: |
      cli.command == "sudo"

    action: deny
    message: "sudo is not permitted for AI agents"


  - name: no-recursive-force-delete
    description: "Block rm -rf and similar dangerous delete patterns"
    enabled: true

    cli_expression: |
      cli.command == "rm" &&
      (cli.arguments.exists(a, a == "-rf") ||
       cli.arguments.exists(a, a == "-fr") ||
       cli.arguments.exists(a, a == "-Rf") ||
       cli.arguments.exists(a, a == "-fR") ||
       (cli.arguments.exists(a, a == "-r" || a == "-R") &&
        cli.arguments.exists(a, a == "-f")))

    action: deny
    message: "Recursive force delete (rm -rf) is not permitted"


  - name: no-chmod-dangerous-permissions
    description: "Block overly permissive chmod operations"
    enabled: true

    cli_expression: |
      cli.command == "chmod" &&
      (cli.arguments.exists(a, a == "777") ||
       cli.arguments.exists(a, a == "666") ||
       cli.arguments.exists(a, a == "a+rwx"))

    action: deny
    message: "Overly permissive file permissions are not allowed"


  - name: no-curl-to-shell
    description: "Block curl piped to shell execution patterns"
    enabled: true

    # Note: This catches 'curl | sh' but the pipe is typically at shell level.
    # The CLI proxy sees the individual commands, so we block suspicious curl flags
    # that are commonly used in curl-to-shell patterns.
    cli_expression: |
      cli.command == "curl" &&
      (cli.arguments.exists(a, a == "-s" || a == "--silent") ||
       cli.arguments.exists(a, a == "-sS") ||
       cli.arguments.exists(a, a == "-sSL"))

    action: deny
    message: "Silent curl downloads are not permitted - use explicit output file"


  - name: no-environment-variable-modification
    description: "Block commands that modify environment variables persistently"
    enabled: true

    cli_expression: |
      cli.command == "export" ||
      (cli.command == "echo" &&
       cli.arguments.exists(a, a.contains(">>") &&
         (a.contains(".bashrc") || a.contains(".zshrc") || a.contains(".profile"))))

    action: deny
    message: "Persistent environment variable modification is not permitted"


  # ============================================================================
  # MCP-ONLY RULES: Using legacy expression field for backwards compatibility
  # These rules only apply to MCP tool calls
  # ============================================================================

  - name: no-bulk-email
    description: "Block bulk email operations through MCP tools"
    enabled: true

    # Legacy 'expression' field - treated as mcp_expression for backwards compatibility
    expression: |
      tool.name == "email__send_bulk" ||
      (tool.name == "email__send" &&
       has(tool.arguments, "recipients") &&
       tool.arguments.recipients.size() > 10)

    action: deny
    message: "Bulk email operations (more than 10 recipients) are not permitted"


  - name: no-database-drop
    description: "Block database drop operations"
    enabled: true

    expression: |
      tool.name == "database__drop" ||
      tool.name == "postgres__drop_database" ||
      tool.name == "mysql__drop_database"

    action: deny
    message: "Database drop operations are not permitted"


  # ============================================================================
  # ALLOW RULES: Explicitly permit safe operations
  # Allow rules take precedence and permit operations that might otherwise
  # be caught by broader deny rules
  # ============================================================================

  - name: allow-safe-kubectl-commands
    description: "Allow read-only kubectl commands"
    enabled: true

    cli_expression: |
      cli.command == "kubectl" &&
      cli.arguments.size() >= 1 &&
      cli.arguments[0] in ["get", "describe", "logs", "top", "explain", "api-resources"]

    action: allow
    message: "Read-only kubectl commands are permitted"


  - name: allow-safe-docker-commands
    description: "Allow read-only docker commands"
    enabled: true

    cli_expression: |
      cli.command == "docker" &&
      cli.arguments.size() >= 1 &&
      cli.arguments[0] in ["ps", "images", "logs", "inspect", "stats", "version", "info"]

    action: allow
    message: "Read-only docker commands are permitted"


  # ============================================================================
  # CONTEXT-AWARE RULES: Using client_info for environment-specific rules
  # ============================================================================

  - name: deny-production-destructive-commands
    description: "Block destructive commands on production hosts"
    enabled: true

    cli_expression: |
      cli.client_info.hostname.contains("prod") &&
      cli.command in ["rm", "mv", "dd", "mkfs", "fdisk"]

    action: deny
    message: "Destructive commands are not permitted on production hosts"


  - name: deny-root-user-operations
    description: "Block operations when running as root"
    enabled: true

    cli_expression: |
      cli.client_info.username == "root" &&
      cli.command in ["rm", "chmod", "chown", "dd", "mkfs"]

    action: deny
    message: "Dangerous operations are not permitted when running as root"
