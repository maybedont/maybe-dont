# MCP Security Gateway Configuration
# This file configures the MCP security gateway service.

# Logging configuration
logging:
  level: info  # debug, info, warn, error
  path: stderr # filename, stderr, stdout

audit:
  enabled: true
  path: ./audit.log # filename, stderr, stdout

# Downstream MCP servers configuration
downstream_mcp_servers:
  github:
    type: http # stdio, sse, http
    url: "https://api.githubcopilot.com/mcp/"
    http:
      headers:
        Authorization: "Bearer ${GITHUB_TOKEN}"
  aws-docs:
    type: stdio
    command: "uvx"
    args: ["awslabs.aws-documentation-mcp-server@latest"]

# Server configuration
server:
  # Server type (stdio, http, sse)
  type: stdio
  # Address to listen on (host:port)
  listen_addr: "0.0.0.0:8080"

# Policy configuration
policy_validation:
  # Enable CEL-based tool validation
  enabled: true
  # Path to CEL policy rules file (optional, uses embedded rules by default)
  # rules_file: "cel_rules.yaml"

# AI validation configuration
ai_validation:
  # Enable AI-powered tool validation
  enabled: true
  # OpenAI-compatible API endpoint
  endpoint: "https://api.openai.com/v1/chat/completions"
  # Model to use for validation
  model: "gpt-4o-mini"
  # Path to AI policy rules file (optional, uses embedded rules by default)
  # rules_file: "ai_rules.yaml"
