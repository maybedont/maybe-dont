# MCP Security Gateway Configuration
# This file configures the MCP security gateway service.

# Logging configuration
logging:
  level: info  # debug, info, warn, error
  path: stderr # filename, stderr, stdout

audit:
  enabled: true
  path: ./audit.log # filename, stderr, stdout

# Downstream MCP servers configuration
downstream_mcp_servers:
  github:
    type: http # stdio, sse, http
    url: "https://api.githubcopilot.com/mcp/"
    http:
      headers:
        Authorization: "Bearer ${GITHUB_TOKEN}"
  aws-docs:
    type: stdio
    command: "uvx"
    args: ["awslabs.aws-documentation-mcp-server@latest"]

# Server configuration
server:
  # Server type (stdio, http, sse)
  type: stdio
  # Address to listen on (host:port)
  listen_addr: "0.0.0.0:8080"
  oauth:
    # Enable OAuth authentication
    enabled: false
    # OAuth authorization server URL
    # authorization_server: "https://auth.example.com"
    authorization_server: "https://dev-vkmwna850dvz1z8g.us.auth0.com"
    # Token validation endpoint (optional, for future token introspection)
    # token_validation_endpoint: "https://auth.example.com/token"
    token_validation_endpoint: "https://dev-vkmwna850dvz1z8g.us.auth0.com/oauth/token"
    # OAuth realm name (defaults to "mcp-server")
    realm: "mcp-server"
    # CORS configuration for .well-known endpoints
    cors:
      # Enable CORS headers for .well-known paths
      enabled: true
      # List of allowed origins (* for all, or specific domains)
      allowed_origins:
        - "*"  # Allow all origins (not recommended for production)
        # - "https://claude.ai"
        # - "https://mcp-inspector.com"
        # - "http://localhost:6274"
      # Max age for preflight cache in seconds (defaults to 86400 - 24 hours)
      max_age: 86400

# Policy configuration
policy_validation:
  # Enable CEL-based tool validation
  enabled: true
  # Path to CEL policy rules file (optional, uses embedded rules by default)
  # rules_file: "cel_rules.yaml"

# AI validation configuration
ai_validation:
  # Enable AI-powered tool validation
  enabled: true
  # OpenAI-compatible API endpoint
  endpoint: "https://api.openai.com/v1/chat/completions"
  # Model to use for validation
  model: "gpt-4o-mini"
  # Path to AI policy rules file (optional, uses embedded rules by default)
  # rules_file: "ai_rules.yaml"
