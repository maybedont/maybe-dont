# MCP Security Gateway Configuration
# This file configures the MCP security gateway service.
#
# Pass-Through Authentication:
# Extract credentials from incoming request headers and forward to downstream servers.
# Enable per-client via auth.pass_through config with header mappings.

# Logging configuration
logging:
  level: info  # debug, info, warn, error
  path: stderr # filename, stderr, stdout

audit:
  enabled: true
  path: ./audit.log # filename, stderr, stdout

# Downstream MCP servers configuration
downstream_mcp_servers:
  # Example 1: Static credentials (traditional approach)
  github:
    type: http # stdio, sse, http
    url: "https://api.githubcopilot.com/mcp/"
    http:
      headers:
        Authorization: "Bearer ${GITHUB_TOKEN}"

  # Example 2: Pass-through authentication
  # Extracts credentials from incoming request headers and forwards to downstream
  # github-passthrough:
  #   type: http
  #   url: "https://api.githubcopilot.com/mcp/"
  #   auth:
  #     pass_through:
  #       enabled: true
  #       headers:
  #         - source_header: "X-GitHub-Token"  # Extract from incoming request
  #           target_header: "Authorization"   # Forward to downstream
  #           format: "Bearer {value}"         # Optional formatting (default: raw value)

  # Example 3: STDIO server (pass-through only works with HTTP/SSE)
  aws-docs:
    type: stdio
    command: "uvx"
    args: ["awslabs.aws-documentation-mcp-server@latest"]

# Server configuration
server:
  # Server type (stdio, http, sse)
  type: stdio
  # Address to listen on (host:port)
  listen_addr: "0.0.0.0:8080"

# Policy configuration
policy_validation:
  # Enable CEL-based tool validation
  enabled: true
  # Path to CEL policy rules file (optional, uses embedded rules by default)
  # rules_file: "cel_rules.yaml"

# AI validation configuration
ai_validation:
  # Enable AI-powered tool validation
  enabled: true
  # OpenAI-compatible API endpoint
  endpoint: "https://api.openai.com/v1/chat/completions"
  # Model to use for validation
  model: "gpt-4o-mini"
  # Path to AI policy rules file (optional, uses embedded rules by default)
  # rules_file: "ai_rules.yaml"

# Response validation configuration
# These policies validate and filter tool call RESPONSES before returning to the client
response_validation:
  # Enable CEL-based response validation
  enabled: false
  # Path to CEL response policy rules file
  rules_file: "cel_response_rules.yaml"

# AI response validation configuration
# Uses AI to detect and filter sensitive information in responses
ai_response_validation:
  # Enable AI-powered response validation
  enabled: false
  # Path to AI response policy rules file
  rules_file: "ai_response_rules.yaml"
  # Note: Uses the same endpoint and model as ai_validation above
